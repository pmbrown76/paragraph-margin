[project]
name = "paragraph-margin"
version = "0.1.0"
description = "YAML-driven margin calculation engine for US BD regulations"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.8"]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.32", "requests>=2.31"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["paragraph_margin"]
