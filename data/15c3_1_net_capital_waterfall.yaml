  - priority: 13
    name: "Equity Haircut"
    rationale: >-
      Equity securities held in proprietary positions receive a flat 15%
      haircut regardless of individual security characteristics. This rate
      reflects the general market risk of equity positions, which exhibit
      higher volatility than fixed-income instruments. The 15% deduction
      applies to the current market value of each long and short equity
      position.
    citation: "15c3-1(c)(2)(vi)(J)"
    rules:

      - rule_id: "15c3_1_haircut_equity"
        name: "Equity Haircut — 15% of Market Value"
        section: "15c3-1(c)(2)(vi)(J)"
        formula_type: "maturity_based_haircut"
        formula_detail: |
          haircut: 15% of market value
          Applies to all equity securities in proprietary positions.
        conditions:
          - security_type = equity
          - position_type = proprietary
        definition: >-
          Per 15c3-1(c)(2)(vi)(J), equity securities held in the proprietary
          account of the broker-dealer are subject to a haircut deduction of
          15% of their current market value. This applies to both long and
          short positions. The haircut is applied to the net long or net short
          position in each individual equity security after netting same-
          security positions across accounts.

  - priority: 14
    name: "Limited-Market Securities Haircut"
    rationale: >-
      Securities for which there is no ready market or for which the market
      is limited pose heightened liquidation risk. The 40% haircut reflects
      the difficulty of disposing of these positions at quoted prices in a
      stress scenario. This category captures thinly traded equities,
      restricted securities, and other instruments where bid-ask spreads
      are wide and depth of market is insufficient to support rapid
      liquidation.
    citation: "15c3-1(c)(2)(vi)(K)"
    rules:

      - rule_id: "15c3_1_haircut_limited_market"
        name: "Limited-Market Securities — 40% of Market Value"
        section: "15c3-1(c)(2)(vi)(K)"
        formula_type: "maturity_based_haircut"
        formula_detail: |
          haircut: 40% of market value
          Applies to securities for which there is no ready market.
        conditions:
          - security_type = any
          - market_liquidity = limited
        definition: >-
          Per 15c3-1(c)(2)(vi)(K), securities for which there is no ready
          market, as defined in 15c3-1(c)(11), are subject to a haircut
          deduction of 40% of market value. A security has no ready market
          if it cannot be sold publicly, if its resale is conditioned on a
          regulatory qualification that has not been obtained, or if there
          is no independent, actively traded market with regular quotations
          from multiple dealers. This includes restricted stock, private
          placements, and thinly traded OTC securities.

  - priority: 15
    name: "Listed Option Haircuts"
    rationale: >-
      Listed options are subject to specialized haircut computations under
      paragraph (c)(2)(x) and Appendix A of Rule 15c3-1. Option positions
      may be paired into recognized strategies (e.g., spreads, straddles,
      conversions) that reduce risk, and the haircut reflects the net risk
      of the strategy rather than the gross risk of individual legs.
      Appendix A provides the detailed methodology for computing option
      haircuts using theoretical pricing models.
    citation: "15c3-1(c)(2)(x) + Appendix A"
    rules:

      - rule_id: "15c3_1_haircut_option"
        name: "Listed Option Haircut — Strategy-Based per Appendix A"
        section: "15c3-1(c)(2)(x)"
        formula_type: "maturity_based_haircut"
        formula_detail: |
          haircut: strategy-based per Appendix A methodology
          Recognized strategies include spreads, straddles, combinations,
          and conversions. Unhedged options use the underlying haircut
          plus the option's in-the-money amount.
        conditions:
          - security_type = listed_option
          - position_type = proprietary
        definition: >-
          Per 15c3-1(c)(2)(x) and Appendix A, listed option positions are
          subject to haircut deductions computed using recognized strategy
          pairings and theoretical pricing models. The computation considers
          the maximum potential loss under specified percentage moves in the
          underlying security. Recognized strategies that limit risk (such
          as vertical spreads, calendar spreads, and conversions) receive
          reduced haircuts reflecting their hedged nature. Unhedged long
          options are valued at market; unhedged short options require a
          haircut equal to the applicable percentage of the underlying
          market value plus any in-the-money amount, less the option premium.

  - priority: 16
    name: "Concentration Charge"
    rationale: >-
      When a broker-dealer's proprietary position in any single issuer
      exceeds 10% of its tentative net capital, the excess concentration
      represents an outsized idiosyncratic risk. The 50% surcharge on the
      excess ensures that firms do not become overly dependent on the
      performance of a single security or issuer, maintaining diversification
      as a pillar of capital adequacy.
    citation: "15c3-1(c)(2)(vi)(M)"
    rules:

      - rule_id: "15c3_1_concentration_charge"
        name: "Concentration Charge — 50% on Excess Over 10% of TNC"
        section: "15c3-1(c)(2)(vi)(M)"
        formula_type: "concentration_charge"
        formula_detail: |
          concentration_charge: 50% of (position_value - 10% × tentative_net_capital)
          Applies only to the portion exceeding the 10% threshold.
        conditions:
          - single_issuer_position > 10% of tentative_net_capital
        definition: >-
          Per 15c3-1(c)(2)(vi)(M), when the net position in securities of
          a single issuer (excluding U.S. government and agency securities)
          exceeds 10% of the broker-dealer's tentative net capital, a
          concentration charge of 50% is applied to the excess amount. This
          charge is in addition to the standard haircut applicable to the
          security type. The purpose is to penalize over-concentration in
          a single name and incentivize portfolio diversification.

  - priority: 17
    name: "Proprietary vs Customer Position Scope"
    rationale: >-
      The net capital haircut deductions under 15c3-1(c)(2) apply exclusively
      to proprietary positions — securities owned by the broker-dealer for
      its own account. Customer securities held in custody or as margin
      collateral are not subject to haircuts because they are not at the
      firm's market risk. This fundamental scoping rule ensures that the
      capital computation reflects only the firm's own risk exposures.
    citation: "15c3-1(c)(1)"
    rules:

      - rule_id: "15c3_1_proprietary_only"
        name: "Haircuts Apply to Proprietary Positions Only"
        section: "15c3-1(c)(1)"
        formula_type: "compliance_requirement"
        formula_detail: |
          scope: proprietary positions only
          Customer securities held in custody or as collateral are excluded
          from haircut computations.
        conditions:
          - position_type = proprietary
        definition: >-
          Per 15c3-1(c)(1), haircut deductions are computed only on securities
          and commodities held in the proprietary accounts of the broker-
          dealer. Securities held in customer accounts, whether in custody or
          pledged as margin collateral, are not subject to haircut deductions
          in the firm's net capital computation. This distinction is
          fundamental: the net capital rule measures the firm's ability to
          absorb losses on its OWN positions, not the market risk of customer
          holdings.

  - priority: 18
    name: "Early Warning Notification"
    rationale: >-
      Rule 17a-11 requires broker-dealers to file immediate notice with the
      SEC and their designated examining authority when net capital falls
      below 120% of the required minimum. This early warning system provides
      regulators advance notice of potential capital adequacy problems before
      they reach critical levels, enabling intervention and heightened
      oversight while the firm may still have time to remediate.
    citation: "17a-11(b)"
    rules:

      - rule_id: "15c3_1_early_warning"
        name: "Early Warning — Net Capital Below 120% of Minimum"
        section: "17a-11(b)"
        formula_type: "notification_requirement"
        formula_detail: |
          notification_trigger: net_capital < 120% of required_minimum
          Firm must file immediate notice with SEC and DEA.
        conditions:
          - net_capital < 120% of required_minimum
        definition: >-
          Per Rule 17a-11(b), a broker-dealer must give notice to the
          Commission, its designated examining authority (DEA), and the
          Securities Investor Protection Corporation (SIPC) when its net
          capital declines below 120% of the minimum required under Rule
          15c3-1. The notice must be filed within 24 hours of the event.
          This early warning threshold provides regulators a buffer period
          to assess the firm's financial condition and, if necessary,
          initiate corrective action before an actual capital deficiency
          occurs.

  - priority: 19
    name: "Capital Withdrawal Restriction"
    rationale: >-
      To prevent broker-dealers from distributing capital to owners or
      affiliates in a manner that would impair their ability to meet net
      capital requirements, Rule 15c3-1(e) restricts withdrawals of equity
      capital. A firm may not make a withdrawal if doing so would cause net
      capital to fall below 120% of its minimum requirement. This restriction
      acts as a built-in governor preventing capital distributions during
      periods of financial stress.
    citation: "15c3-1(e)"
    rules:

      - rule_id: "15c3_1_withdrawal_restriction"
        name: "Capital Withdrawal Restriction — 120% Post-Withdrawal Floor"
        section: "15c3-1(e)"
        formula_type: "restriction"
        formula_detail: |
          restriction: no withdrawal if post_withdrawal_net_capital < 120% of required_minimum
          Applies to equity capital withdrawals, loans to affiliates,
          and distributions to partners/shareholders.
        conditions:
          - post_withdrawal_net_capital < 120% of required_minimum
        definition: >-
          Per 15c3-1(e), no broker-dealer shall permit the withdrawal of
          equity capital (including repayment of subordinated debt, loans
          to affiliates, or distributions to partners or shareholders) if,
          after giving effect to the withdrawal, the firm's net capital
          would be less than 120% of the minimum required under paragraph
          (a). Withdrawals exceeding 30% of excess net capital in any
          rolling 30-day period require prior written notice to the SEC
          and the firm's DEA at least two business days before the intended
          withdrawal date.
