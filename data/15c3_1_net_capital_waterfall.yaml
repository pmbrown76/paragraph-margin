  - priority: 10
    name: "Commercial Paper Haircuts"
    rationale: >-
      Commercial paper is a short-term unsecured promissory note issued by
      corporations, typically with maturities under 270 days. The haircut
      schedule reflects the very low duration risk of these instruments,
      ranging from 0% for paper maturing within 30 days to 0.5% for paper
      approaching the 270-day statutory maximum. Only investment-grade
      commercial paper is eligible for these favorable haircuts.
