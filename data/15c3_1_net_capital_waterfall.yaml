  - priority: 9
    name: "Municipal Bond Haircuts (Long-Term / General)"
    rationale: >-
      General municipal bonds that do not qualify for the short-term high-grade
      treatment receive higher haircuts under paragraph (C). These securities
      carry more credit risk and/or longer duration, requiring greater capital
      deductions. The schedule ranges from 1% for the shortest maturities to
      7% for bonds maturing beyond 25 years.
    citation: "15c3-1(c)(2)(vi)(C)"
    rules:

      - rule_id: "15c3_1_haircut_muni_lt_1y"
        name: "Municipal Long-Term Haircut — Maturity ≤ 1 Year"
        section: "15c3-1(c)(2)(vi)(C)(1)"
        formula_type: "maturity_based_haircut"
        formula_detail: |
          haircut: 1% of market value
          Maturity: ≤ 1 year
        conditions:
          - security_type = municipal
          - grade = general
          - maturity <= 1 year
        definition: >-
          Per 15c3-1(c)(2)(vi)(C), general municipal securities with a
          remaining maturity of 1 year or less receive a 1% haircut on
          market value.

