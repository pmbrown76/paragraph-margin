          remaining maturity greater than 5 years but not exceeding 7 years
          receive a 0.35% haircut on market value.

      - rule_id: "15c3_1_haircut_muni_st_10y"
        name: "Municipal Short-Term Haircut — Maturity > 7 to 10 Years"
        section: "15c3-1(c)(2)(vi)(B)(1)"
        formula_type: "maturity_based_haircut"
        formula_detail: |
