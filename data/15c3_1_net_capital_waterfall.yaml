          - maturity <= 1 year
        definition: >-
          Per 15c3-1(c)(2)(vi)(F), non-investment-grade corporate debt
          securities with a remaining maturity of 1 year or less receive a
          4% haircut on market value, double the investment-grade rate.

      - rule_id: "15c3_1_haircut_corp_nig_2y"
