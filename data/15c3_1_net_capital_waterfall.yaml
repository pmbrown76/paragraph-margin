  - priority: 12
    name: "Corporate Bond Haircuts (Non-Investment Grade)"
    rationale: >-
      Non-investment-grade (high-yield) corporate bonds carry significantly
      higher credit risk and wider bid-ask spreads than their investment-grade
      counterparts. The haircut schedule approximately doubles the IG rates,
      ranging from 4% for short maturities to 15% for bonds exceeding 25
      years. These elevated haircuts ensure that broker-dealers holding
      speculative-grade debt maintain capital commensurate with the higher
      probability of default and loss given default.
    citation: "15c3-1(c)(2)(vi)(F)"
    rules:

      - rule_id: "15c3_1_haircut_corp_nig_1y"
        name: "Corporate Non-IG Haircut — Maturity ≤ 1 Year"
