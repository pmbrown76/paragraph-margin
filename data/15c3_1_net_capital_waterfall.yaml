## SEC Rule 15c3-1 — Net Capital Waterfall
##
## Determines the minimum net capital requirement and haircut deductions
## for broker-dealers under the SEC's Uniform Net Capital Rule. Rules are
## evaluated in priority order; the applicable method (Basic or Alternative)
## determines the capital formula, minimum capital floors apply by BD type,
## and haircut schedules reduce the value of proprietary securities positions.
##
## Key difference from margin waterfalls: 15c3-1 governs the FIRM's own
## capital adequacy, not customer margin requirements. There are no
## reg_t_initial or finra_maintenance fields. Instead, rules use formula
## types such as capital_requirement, maturity_based_haircut,
## concentration_charge, restriction, and notification_requirement.
##
## Sources:
##   - 17 CFR 240.15c3-1 — Net Capital Requirements for Brokers or Dealers
##   - 17 CFR 240.15c3-1(a) — Net capital requirement methods
##   - 17 CFR 240.15c3-1(c)(2)(vi) — Haircut schedules by security type
##   - 17 CFR 240.15c3-1(c)(2)(x) + Appendix A — Option haircuts
##   - 17 CFR 240.17a-11 — Early warning notification
##   - 17 CFR 240.15c3-1(e) — Capital withdrawal restrictions

categories:

  - priority: 1
    name: "Basic Method (15:1 Aggregate Indebtedness Ratio)"
    rationale: >-
      The Basic Method is the default net capital computation for broker-dealers
      that do not elect the Alternative Method. It requires net capital equal to
      at least 6-2/3% of aggregate indebtedness, establishing a 15:1 ratio of
      liabilities to capital. This method is simpler but generally more
      conservative than the Alternative Method, and is typically used by smaller
      firms that do not carry customer accounts.
    citation: "15c3-1(a)(1)(i)"
    rules:

      - rule_id: "15c3_1_basic_method"
        name: "Basic Method — 6.67% of Aggregate Indebtedness"
        section: "15c3-1(a)(1)(i)"
        formula_type: "capital_requirement"
        formula_detail: |
          capital_requirement: 6.67% of aggregate indebtedness
          Aggregate indebtedness includes all money owed by the BD,
          excluding certain exempted liabilities defined in 15c3-1(c)(1).
        conditions:
          - method = basic
        definition: >-
          Per 15c3-1(a)(1)(i), a broker-dealer using the Basic Method must
          maintain net capital equal to not less than 6-2/3 percent of its
          aggregate indebtedness. Aggregate indebtedness is the total money
          liability of the broker or dealer, as defined in 15c3-1(c)(1),
          arising in connection with any transaction whatsoever, excluding
          certain specified liabilities such as adequately secured
          indebtedness and floor brokerage accounts.

  - priority: 2
    name: "Alternative Method (2% Aggregate Debit Items)"
    rationale: >-
      The Alternative Method, available to broker-dealers that carry customer
      accounts and compute the Customer Reserve Formula under 15c3-3, ties
      the capital requirement to customer debit items rather than liabilities.
      This method generally permits higher leverage and is preferred by larger
      carrying and clearing firms. The 2% rate reflects the SEC's judgment
      that firms holding customer assets need capital proportional to customer
      exposure.
    citation: "15c3-1(a)(1)(ii)"
    rules:

      - rule_id: "15c3_1_alternative_method"
        name: "Alternative Method — 2% of Aggregate Debit Items"
        section: "15c3-1(a)(1)(ii)"
        formula_type: "capital_requirement"
        formula_detail: |
          capital_requirement: 2% of aggregate debit items
          Aggregate debit items computed per 15c3-3a (Customer Reserve Formula).
        conditions:
          - method = alternative
          - computes_customer_reserve = true
        definition: >-
          Per 15c3-1(a)(1)(ii), a broker-dealer that elects the Alternative
          Method must maintain net capital equal to not less than 2 percent
          of aggregate debit items as computed in accordance with the Formula
          for Determination of Reserve Requirements under Rule 15c3-3a.
          This method is available only to broker-dealers that carry customer
          accounts and file FOCUS reports reflecting the Customer Reserve
          Formula computation.

  - priority: 3
    name: "Minimum Net Capital — Introducing Broker-Dealer"
    rationale: >-
      The SEC establishes dollar-floor minimums by broker-dealer type to ensure
      that even firms with minimal activity maintain a baseline level of
      capital. An introducing broker-dealer that does not receive, hold, or
      handle customer funds or securities has the lowest minimum at $5,000,
      reflecting its limited risk profile.
    citation: "15c3-1(a)(2)(i)"
    rules:

      - rule_id: "15c3_1_min_intro_bd"
        name: "Minimum Net Capital — Introducing BD ($5,000)"
        section: "15c3-1(a)(2)(i)"
        formula_type: "capital_requirement"
        formula_detail: |
          capital_requirement: $5,000 fixed minimum
          Applies to introducing BDs that do not receive or handle
          customer funds or securities.
        conditions:
          - bd_type = introducing
          - receives_customer_funds = false
        definition: >-
          Per 15c3-1(a)(2)(i), a broker-dealer that does not carry customer
          accounts, does not receive or hold funds or securities for customers,
          and introduces all of its transactions on a fully-disclosed basis to
          another broker-dealer must maintain minimum net capital of $5,000.
          This is the lowest capital floor and reflects the limited operational
          risk of a pure introducing firm.

  - priority: 4
    name: "Minimum Net Capital — Introducing BD Receiving Funds"
    rationale: >-
      An introducing broker-dealer that receives but does not hold customer
      funds or securities has incrementally higher risk than a pure introducer.
      The $50,000 minimum reflects the additional operational risk of handling
      customer assets, even temporarily, before transmitting them to a
      carrying firm.
    citation: "15c3-1(a)(2)(ii)"
    rules:

      - rule_id: "15c3_1_min_intro_receives"
        name: "Minimum Net Capital — Intro BD Receives Funds ($50,000)"
        section: "15c3-1(a)(2)(ii)"
        formula_type: "capital_requirement"
        formula_detail: |
          capital_requirement: $50,000 fixed minimum
          Applies to introducing BDs that receive but do not hold
          customer funds or securities.
        conditions:
          - bd_type = introducing
          - receives_customer_funds = true
          - holds_customer_funds = false
        definition: >-
          Per 15c3-1(a)(2)(ii), a broker-dealer that introduces transactions
          on a fully-disclosed basis but receives customer funds or securities
          must maintain minimum net capital of $50,000. This higher floor
          accounts for the transit risk inherent in handling customer assets
          before prompt transmittal to the carrying broker-dealer.

  - priority: 5
    name: "Minimum Net Capital — Carrying/Clearing Firm"
    rationale: >-
      Carrying and clearing broker-dealers hold customer funds and securities,
      maintain customer accounts, and bear the full range of operational and
      counterparty risks. The $250,000 minimum is the highest standard floor,
      reflecting the systemic importance and risk concentration of firms that
      custody customer assets.
    citation: "15c3-1(a)(2)(iii)"
    rules:

      - rule_id: "15c3_1_min_carrying"
        name: "Minimum Net Capital — Carrying/Clearing ($250,000)"
        section: "15c3-1(a)(2)(iii)"
        formula_type: "capital_requirement"
        formula_detail: |
          capital_requirement: $250,000 fixed minimum
          Applies to broker-dealers that carry customer accounts
          or clear transactions.
        conditions:
          - bd_type = carrying
        definition: >-
          Per 15c3-1(a)(2)(iii), a broker-dealer that carries customer
          accounts, holds customer funds or securities, or acts as a
          clearing firm must maintain minimum net capital of $250,000.
          This floor applies regardless of whether the firm uses the
          Basic or Alternative Method, and reflects the higher risk
          profile of firms that custody customer assets.

  - priority: 6
    name: "Minimum Net Capital — Market Maker"
    rationale: >-
      Market makers that hold themselves out as willing to buy and sell
      securities for their own account on a continuous basis take on
      concentrated inventory risk. The $100,000 minimum applies to OTC
      market makers and specialists, reflecting the capital needed to
      support their continuous quoting obligations.
    citation: "15c3-1(a)(2)(iv)"
    rules:

      - rule_id: "15c3_1_min_market_maker"
        name: "Minimum Net Capital — Market Maker ($100,000)"
        section: "15c3-1(a)(2)(iv)"
        formula_type: "capital_requirement"
        formula_detail: |
          capital_requirement: $100,000 fixed minimum
          Applies to broker-dealers acting as OTC market makers.
        conditions:
          - bd_type = market_maker
        definition: >-
          Per 15c3-1(a)(2)(iv), a broker-dealer that acts as a market
          maker in OTC securities or as a specialist on a national
          securities exchange must maintain minimum net capital of
          $100,000. This requirement ensures that market makers have
          sufficient capital to absorb losses from their continuous
          two-sided quoting obligations and concentrated inventory
          positions.

  - priority: 7
    name: "U.S. Treasury Haircuts"
    rationale: >-
      U.S. Treasury securities receive the lowest haircuts of any security
      type, reflecting their status as risk-free obligations backed by the
      full faith and credit of the United States government. Haircuts increase
      with maturity to account for interest rate risk — longer-dated
      Treasuries exhibit greater price volatility in response to rate changes.
      The maturity-tiered schedule ensures that capital charges are
      proportional to the actual market risk of the position.
    citation: "15c3-1(c)(2)(vi)(A)"
    rules:

      - rule_id: "15c3_1_haircut_treasury_3m"
        name: "Treasury Haircut — Maturity ≤ 3 Months"
        section: "15c3-1(c)(2)(vi)(A)(1)"
        formula_type: "maturity_based_haircut"
        formula_detail: |
          haircut: 0% of market value
          Maturity: ≤ 3 months
        conditions:
          - security_type = us_treasury
          - maturity <= 3 months
        definition: >-
          Per 15c3-1(c)(2)(vi)(A), U.S. Treasury securities with a remaining
          maturity of 3 months or less receive a 0% haircut. The negligible
          duration risk of very short-term government obligations warrants
          no capital deduction.

      - rule_id: "15c3_1_haircut_treasury_6m"
        name: "Treasury Haircut — Maturity > 3 to 6 Months"
        section: "15c3-1(c)(2)(vi)(A)(1)"
        formula_type: "maturity_based_haircut"
        formula_detail: |
          haircut: 0.5% of market value
          Maturity: > 3 months to 6 months
        conditions:
          - security_type = us_treasury
          - maturity > 3 months
          - maturity <= 6 months
        definition: >-
          Per 15c3-1(c)(2)(vi)(A), U.S. Treasury securities with a remaining
          maturity greater than 3 months but not exceeding 6 months receive
          a 0.5% haircut on market value.

      - rule_id: "15c3_1_haircut_treasury_9m"
        name: "Treasury Haircut — Maturity > 6 to 9 Months"
        section: "15c3-1(c)(2)(vi)(A)(1)"
        formula_type: "maturity_based_haircut"
        formula_detail: |
          haircut: 0.75% of market value
          Maturity: > 6 months to 9 months
        conditions:
          - security_type = us_treasury
          - maturity > 6 months
          - maturity <= 9 months
        definition: >-
          Per 15c3-1(c)(2)(vi)(A), U.S. Treasury securities with a remaining
          maturity greater than 6 months but not exceeding 9 months receive
          a 0.75% haircut on market value.

      - rule_id: "15c3_1_haircut_treasury_12m"
        name: "Treasury Haircut — Maturity > 9 to 12 Months"
        section: "15c3-1(c)(2)(vi)(A)(1)"
        formula_type: "maturity_based_haircut"
        formula_detail: |
          haircut: 1% of market value
          Maturity: > 9 months to 12 months
        conditions:
          - security_type = us_treasury
          - maturity > 9 months
          - maturity <= 12 months
        definition: >-
          Per 15c3-1(c)(2)(vi)(A), U.S. Treasury securities with a remaining
          maturity greater than 9 months but not exceeding 12 months receive
          a 1% haircut on market value.

      - rule_id: "15c3_1_haircut_treasury_2y"
        name: "Treasury Haircut — Maturity > 1 to 2 Years"
        section: "15c3-1(c)(2)(vi)(A)(1)"
        formula_type: "maturity_based_haircut"
        formula_detail: |
          haircut: 1.5% of market value
          Maturity: > 1 year to 2 years
        conditions:
          - security_type = us_treasury
          - maturity > 1 year
          - maturity <= 2 years
        definition: >-
          Per 15c3-1(c)(2)(vi)(A), U.S. Treasury securities with a remaining
          maturity greater than 1 year but not exceeding 2 years receive
          a 1.5% haircut on market value.

      - rule_id: "15c3_1_haircut_treasury_3y"
        name: "Treasury Haircut — Maturity > 2 to 3 Years"
        section: "15c3-1(c)(2)(vi)(A)(1)"
        formula_type: "maturity_based_haircut"
        formula_detail: |
          haircut: 2% of market value
          Maturity: > 2 years to 3 years
        conditions:
          - security_type = us_treasury
          - maturity > 2 years
          - maturity <= 3 years
        definition: >-
          Per 15c3-1(c)(2)(vi)(A), U.S. Treasury securities with a remaining
          maturity greater than 2 years but not exceeding 3 years receive
          a 2% haircut on market value.

      - rule_id: "15c3_1_haircut_treasury_5y"
        name: "Treasury Haircut — Maturity > 3 to 5 Years"
        section: "15c3-1(c)(2)(vi)(A)(1)"
        formula_type: "maturity_based_haircut"
        formula_detail: |
          haircut: 3% of market value
          Maturity: > 3 years to 5 years
        conditions:
          - security_type = us_treasury
          - maturity > 3 years
          - maturity <= 5 years
        definition: >-
          Per 15c3-1(c)(2)(vi)(A), U.S. Treasury securities with a remaining
          maturity greater than 3 years but not exceeding 5 years receive
          a 3% haircut on market value.

      - rule_id: "15c3_1_haircut_treasury_7y"
        name: "Treasury Haircut — Maturity > 5 to 7 Years"
        section: "15c3-1(c)(2)(vi)(A)(1)"
        formula_type: "maturity_based_haircut"
        formula_detail: |
          haircut: 3.5% of market value
          Maturity: > 5 years to 7 years
        conditions:
          - security_type = us_treasury
          - maturity > 5 years
          - maturity <= 7 years
        definition: >-
          Per 15c3-1(c)(2)(vi)(A), U.S. Treasury securities with a remaining
          maturity greater than 5 years but not exceeding 7 years receive
          a 3.5% haircut on market value.

      - rule_id: "15c3_1_haircut_treasury_10y"
        name: "Treasury Haircut — Maturity > 7 to 10 Years"
        section: "15c3-1(c)(2)(vi)(A)(1)"
        formula_type: "maturity_based_haircut"
        formula_detail: |
          haircut: 4% of market value
          Maturity: > 7 years to 10 years
        conditions:
          - security_type = us_treasury
          - maturity > 7 years
          - maturity <= 10 years
        definition: >-
          Per 15c3-1(c)(2)(vi)(A), U.S. Treasury securities with a remaining
          maturity greater than 7 years but not exceeding 10 years receive
          a 4% haircut on market value.

      - rule_id: "15c3_1_haircut_treasury_15y"
        name: "Treasury Haircut — Maturity > 10 to 15 Years"
        section: "15c3-1(c)(2)(vi)(A)(1)"
        formula_type: "maturity_based_haircut"
        formula_detail: |
          haircut: 4.5% of market value
          Maturity: > 10 years to 15 years
        conditions:
          - security_type = us_treasury
          - maturity > 10 years
          - maturity <= 15 years
        definition: >-
          Per 15c3-1(c)(2)(vi)(A), U.S. Treasury securities with a remaining
          maturity greater than 10 years but not exceeding 15 years receive
          a 4.5% haircut on market value.

      - rule_id: "15c3_1_haircut_treasury_25y"
        name: "Treasury Haircut — Maturity > 15 to 25 Years"
        section: "15c3-1(c)(2)(vi)(A)(1)"
        formula_type: "maturity_based_haircut"
        formula_detail: |
          haircut: 5% of market value
          Maturity: > 15 years to 25 years
        conditions:
          - security_type = us_treasury
          - maturity > 15 years
          - maturity <= 25 years
        definition: >-
          Per 15c3-1(c)(2)(vi)(A), U.S. Treasury securities with a remaining
          maturity greater than 15 years but not exceeding 25 years receive
          a 5% haircut on market value.

      - rule_id: "15c3_1_haircut_treasury_25y_plus"
        name: "Treasury Haircut — Maturity > 25 Years"
        section: "15c3-1(c)(2)(vi)(A)(1)"
        formula_type: "maturity_based_haircut"
        formula_detail: |
          haircut: 6% of market value
          Maturity: > 25 years
        conditions:
          - security_type = us_treasury
          - maturity > 25 years
        definition: >-
          Per 15c3-1(c)(2)(vi)(A), U.S. Treasury securities with a remaining
          maturity greater than 25 years receive a 6% haircut on market value.
          This is the maximum Treasury haircut, reflecting the significant
          duration risk of ultra-long-dated government obligations.

  - priority: 8
    name: "Municipal Bond Haircuts (Short-Term / High-Grade)"
    rationale: >-
      Short-term, high-grade municipal securities carry low credit and interest
      rate risk and accordingly receive favorable haircut treatment. These
      haircuts apply to municipal securities that meet the definition of
      exempted securities under the Securities Exchange Act and have short
      remaining maturities. The tiered schedule reflects increasing duration
      risk as maturity extends.
    citation: "15c3-1(c)(2)(vi)(B)"
    rules:

      - rule_id: "15c3_1_haircut_muni_st_1y"
        name: "Municipal Short-Term Haircut — Maturity ≤ 1 Year"
        section: "15c3-1(c)(2)(vi)(B)(1)"
        formula_type: "maturity_based_haircut"
        formula_detail: |
          haircut: 0% of market value
          Maturity: ≤ 1 year
        conditions:
          - security_type = municipal
          - grade = high
          - maturity <= 1 year
        definition: >-
          Per 15c3-1(c)(2)(vi)(B), high-grade municipal securities with a
          remaining maturity of 1 year or less receive a 0% haircut, reflecting
          minimal credit and duration risk.

      - rule_id: "15c3_1_haircut_muni_st_2y"
        name: "Municipal Short-Term Haircut — Maturity > 1 to 2 Years"
        section: "15c3-1(c)(2)(vi)(B)(1)"
        formula_type: "maturity_based_haircut"
        formula_detail: |
          haircut: 0.1% of market value
          Maturity: > 1 year to 2 years
        conditions:
          - security_type = municipal
          - grade = high
          - maturity > 1 year
          - maturity <= 2 years
        definition: >-
          Per 15c3-1(c)(2)(vi)(B), high-grade municipal securities with a
          remaining maturity greater than 1 year but not exceeding 2 years
          receive a 0.1% haircut on market value.

      - rule_id: "15c3_1_haircut_muni_st_5y"
        name: "Municipal Short-Term Haircut — Maturity > 2 to 5 Years"
        section: "15c3-1(c)(2)(vi)(B)(1)"
