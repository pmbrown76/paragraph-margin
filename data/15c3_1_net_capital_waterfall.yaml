          - maturity <= 30 days
        definition: >-
          Per 15c3-1(c)(2)(vi)(D), investment-grade commercial paper with a
          remaining maturity of 30 days or less receives a 0% haircut,
          reflecting the negligible credit and duration risk of very
          short-term high-quality paper.

