          remaining maturity greater than 2 years but not exceeding 5 years
          receive a 0.2% haircut on market value.

      - rule_id: "15c3_1_haircut_muni_st_7y"
        name: "Municipal Short-Term Haircut — Maturity > 5 to 7 Years"
        section: "15c3-1(c)(2)(vi)(B)(1)"
        formula_type: "maturity_based_haircut"
        formula_detail: |
          haircut: 0.35% of market value
          Maturity: > 5 years to 7 years
        conditions:
