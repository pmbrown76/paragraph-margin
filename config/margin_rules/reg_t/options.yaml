  # --- Naked equity options: per SRO rules (same formula as FINRA 4210) ---

  - id: "reg_t_naked_call_equity"
    description: "Naked equity call — per SRO rules"
    citation: "Reg T 220.12(c)"
    source_quote: >
      In the case of puts and calls issued by a registered clearing corporation
      and listed or traded on a registered national securities exchange or a
      registered securities association, the amount, or other position specified
      by the rules of the registered national securities exchange or the
      registered securities association authorized to trade the option or
      warrant, provided that all such rules have been approved or amended by
      the SEC.
    conditions:
      security_type: "option"
      option_type: "call"
      position_side: "short"
      covered: false
      underlying_type: "equity"
      index_type: null
    formula:
      type: "naked_option"
      premium_pct: 1.00
      underlying_pct: 0.20
      otm_deduction: true
      minimum_underlying_pct: 0.10
      minimum_per_contract: 250

  - id: "reg_t_naked_put_equity"
    description: "Naked equity put — per SRO rules"
