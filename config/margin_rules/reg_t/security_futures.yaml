# Regulation T 220.12(f) — Security Futures Initial Margin
# ========================================================
# Security futures initial margin is 20% per SEC mandate.
# Unlike other securities, Reg T initial margin equals the
# maintenance requirement for security futures.

rule_set:
  regulation: "Regulation T"
  authority: "Federal Reserve Board"
  cfr: "12 CFR Part 220"
  section: "220.12(f)"
  description: "Reg T initial margin requirements for security futures"
  effective_date: "2024-01-01"
  notes: >
    Under Reg T 220.12(f), security futures initial margin is set at 20%
    of the current market value, matching the maintenance requirement per
    SEC Rule 403(b)(2). This is lower than the standard 50% Reg T rate
    for equities because security futures margin is federally mandated
    at a uniform level.

rules:
  - id: "reg_t_security_future_long"
    description: "Long security future - initial margin"
    citation: "Reg T 220.12(f)"
    source_quote: >
      Put or call on a security, certificate of deposit, securities index or
      foreign currency or a warrant on a securities index or foreign currency:
      In the case of puts and calls issued by a registered clearing corporation
      and listed or traded on a registered national securities exchange or a
      registered securities association, the amount, or other position specified
      by the rules of the registered national securities exchange or the
      registered securities association authorized to trade the option or
      warrant, provided that all such rules have been approved or amended by
      the SEC.
    conditions:
      security_type: "security_future"
      position_side: "long"
    formula:
      type: "percentage_of_trade_value"
      rate: 0.20
    notes: "20% initial margin for long security futures."

  - id: "reg_t_security_future_short"
    description: "Short security future - initial margin"
    citation: "Reg T 220.12(f)"
    source_quote: >
      Put or call on a security, certificate of deposit, securities index or
      foreign currency or a warrant on a securities index or foreign currency:
      In the case of puts and calls issued by a registered clearing corporation
      and listed or traded on a registered national securities exchange or a
      registered securities association, the amount, or other position specified
      by the rules of the registered national securities exchange or the
      registered securities association authorized to trade the option or
      warrant, provided that all such rules have been approved or amended by
      the SEC.
    conditions:
      security_type: "security_future"
      position_side: "short"
    formula:
      type: "percentage_of_trade_value"
      rate: 0.20
    notes: "20% initial margin for short security futures."
