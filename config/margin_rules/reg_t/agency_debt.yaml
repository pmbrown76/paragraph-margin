rule_set:
  regulation: "Regulation T"
  authority: "Federal Reserve Board"
  cfr: "12 CFR Part 220"
  section: "220.18"
  description: "Reg T initial margin for agency debt and mortgage-related securities (exempt securities)"
  effective_date: "1974-01-03"
  last_amended: "2024-05-28"
  notes: >
    Agency securities (GNMA, FNMA, FHLMC) are exempt securities under Reg T Section 220.18.
    They receive good-faith margin treatment — no specific federal initial margin rate
    is prescribed. The effective initial margin is set by the broker-dealer, subject to
    FINRA 4210(e)(2)(D) minimums.

rules:
  - id: "reg_t_agency_debt_long"
    description: "Long agency debt - initial margin (exempt security)"
    citation: "Reg T 220.18"
    source_quote: >
      Exempted security, non-equity security, money market mutual fund or
      exempted securities mutual fund: The margin required by the creditor
      in good faith.
    conditions:
      security_type: "agency_debt"
      position_side: "long"
    formula:
      type: "good_faith"
      rate: 0.0
    notes: >
      Agency debt securities are exempt securities — Reg T defers to good-faith margin.
      Effective initial margin is determined by FINRA 4210(e)(2)(D) maturity-tiered rates.
      Rate set to 0 here; the FINRA 4210 rules provide the binding requirement.

  - id: "reg_t_agency_debt_short"
    description: "Short agency debt - initial margin (exempt security)"
    citation: "Reg T 220.18"
    source_quote: >
      Exempted security, non-equity security, money market mutual fund or
      exempted securities mutual fund: The margin required by the creditor
      in good faith.
    conditions:
      security_type: "agency_debt"
      position_side: "short"
    formula:
      type: "good_faith"
      rate: 0.0
    notes: "Short sale of agency debt. Good-faith margin; FINRA rates apply."
