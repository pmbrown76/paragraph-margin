rule_set:
  regulation: "Regulation T"
  authority: "Federal Reserve Board"
  cfr: "12 CFR Part 220"
  section: "220.18"
  description: "Reg T initial margin for US Government securities (exempt securities)"
  effective_date: "1974-01-03"
  last_amended: "2024-05-28"
  notes: >
    US Government securities are exempt securities under Reg T Section 220.18.
    They receive good-faith margin treatment — no specific federal initial margin rate
    is prescribed. The effective initial margin is set by the broker-dealer, subject to
    FINRA 4210(e)(2)(A) minimums. Most firms use FINRA maintenance rates as initial.

rules:
  - id: "reg_t_treasury_long"
    description: "Long US Treasury - initial margin (exempt security)"
    citation: "Reg T 220.18"
    source_quote: >
      Exempted security, non-equity security, money market mutual fund or
      exempted securities mutual fund: The margin required by the creditor
      in good faith.
    conditions:
      security_type: "us_treasury"
      position_side: "long"
    formula:
      type: "good_faith"
      rate: 0.0
    notes: >
      Treasuries are exempt securities — Reg T defers to good-faith margin.
      Effective initial margin is determined by FINRA 4210(e)(2)(A) maturity-tiered rates.
      Rate set to 0 here; the FINRA 4210 rules provide the binding requirement.

  - id: "reg_t_treasury_short"
    description: "Short US Treasury - initial margin (exempt security)"
    citation: "Reg T 220.18"
    source_quote: >
      Exempted security, non-equity security, money market mutual fund or
      exempted securities mutual fund: The margin required by the creditor
      in good faith.
    conditions:
      security_type: "us_treasury"
      position_side: "short"
    formula:
      type: "good_faith"
      rate: 0.0
    notes: "Short sale of US Treasury. Good-faith margin; FINRA rates apply."
