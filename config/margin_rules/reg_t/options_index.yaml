    conditions:
      security_type: "option"
      option_type: "put"
      position_side: "short"
      covered: false
      underlying_type: "index"
      index_type: "narrow_based"
      settlement_type: "cash"
    formula:
      type: "naked_option"
      premium_pct: 1.00
      underlying_pct: 0.20
      otm_deduction: true
      minimum_underlying_pct: 0.10
      minimum_per_contract: 100
    notes: >
      Reg T defers to FINRA 4210(f)(6)(B) for naked narrow-based index options.
      100% of premium plus 20% of underlying index value, less out-of-the-money
      amount. Minimum: 100% of premium plus 10% of underlying.
