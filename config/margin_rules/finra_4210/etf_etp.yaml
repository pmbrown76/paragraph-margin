rule_set:
  regulation: "FINRA Rule 4210"
  section: "4210(c)(1), 4210(c)/13"
  description: "ETF and ETP maintenance margin requirements"
  effective_date: "2009-12-01"
  notes: >
    Standard ETFs follow equity maintenance margin rules under 4210(c)(1).
    Leveraged and inverse ETFs/ETPs are subject to scaled margin rates per
    Interpretation 4210(c)/13, which codified FINRA Regulatory Notice 09-53.
    Long margin = leverage x 25% (capped at 100%). Short margin = leverage
    x 30% (no cap).

rules:
  # Standard (1x) ETFs - same as equities
  - id: "4210_etf_1x_long"
    description: "Standard (1x) ETF - long"
    citation: "FINRA 4210(c)(1)"
    source_quote: >
      25 percent of the current market value of all margin securities, as
      defined in Section 220.2 of Regulation T, except for security futures
      contracts, "long" in the account.
    conditions:
      security_type: "etf"
      position_side: "long"
      leverage_factor: 1
    formula:
      type: "percentage_of_market_value"
      rate: 0.25
    notes: "Same as standard equity long maintenance"

  - id: "4210_etf_1x_short"
    description: "Standard (1x) ETF - short"
    citation: "FINRA 4210(c)(1)"
    source_quote: >
      $5.00 per share or 30 percent of the current market value, whichever
      amount is greater, of each stock "short" in the account selling at
      $5.00 per share or above.
    conditions:
      security_type: "etf"
      position_side: "short"
      leverage_factor: 1
    formula:
      type: "percentage_of_market_value"
      rate: 0.30
    notes: "Same as standard equity short maintenance"

  # 1.5x Leveraged ETFs
  - id: "4210_etf_1_5x_long"
    description: "1.5x leveraged ETF - long"
    citation: "FINRA 4210(c)/13"
    source_quote: >
      The initial and maintenance margin requirement leveraged exchange
      trade products, including exchange traded funds (ETFs) and exchange
      traded notes (ETNs) designed to generate multiples (e.g., two times
      (2x), three times (3x), etc.) of the performance of a reference
      instrument, index or benchmark (leveraged ETPs) carried long or
      short in a customer's account is increased by an amount
      commensurate with its leverage, subject to a cap of 100% of the
      current market value on a long position (but without a cap on the
      margin on a short position).
    conditions:
      security_type: "etf"
      position_side: "long"
      leverage_factor: 1.5
    formula:
      type: "percentage_of_market_value"
      rate: 0.375
    notes: "1.5 x 25% = 37.5%"

  - id: "4210_etf_1_5x_short"
    description: "1.5x leveraged ETF - short"
    citation: "FINRA 4210(c)/13"
    source_quote: >
      The initial and maintenance margin requirement leveraged exchange
      trade products, including exchange traded funds (ETFs) and exchange
      traded notes (ETNs) designed to generate multiples (e.g., two times
      (2x), three times (3x), etc.) of the performance of a reference
      instrument, index or benchmark (leveraged ETPs) carried long or
      short in a customer's account is increased by an amount
      commensurate with its leverage, subject to a cap of 100% of the
      current market value on a long position (but without a cap on the
