  citation: FINRA 4210(f)(2)(A)(xxvi)
  source_quote: >-
    (xxvi) The term "numerical index value," when used in respect of a currency index warrant or stock
    index warrant, shall mean the level of a particular currency index or stock index as reported by the
    reporting authority for the index.
  conditions:
