rule_set:
  regulation: FINRA Rule 4210
  section: 4210(e)(2)(D)
  description: Mortgage-related securities and agency debt maintenance margin
  effective_date: '2024-01-01'
  notes: >
    FINRA 4210(e)(2)(D) sets maintenance margin for mortgage-related securities including agency pass-throughs
    (GNMA, FNMA, FHLMC), CMOs, TBAs, and agency debentures. GNMA securities carry the full faith and credit
    of the US Government and are treated as government securities under 4210(e)(2)(A).
rules:
- id: 4210_agency_gnma_under_5y
  description: GNMA pass-through - average life < 5 years
  citation: FINRA 4210(e)(2)(D)
  source_quote: >-
    (D) Baskets Notwithstanding the other provisions of this Rule, a member may clear and carry basket
    transactions of one or more members registered as market makers (who are deemed specialists for purposes
    of Section 7 of the Exchange Act pursuant to the rules of a national securities exchange) upon a margin
    basis satisfactory to the concerned parties, provided all real and potential risks in accounts carried
    under such arrangements are at all times adequately covered by the margin maintained in the account
    or, in the absence thereof, by the carrying member when computing net capital under SEA Rule 15c3-1
    and, if applicable, Rule 4110(a).
  conditions:
    security_type: agency_debt
    is_gnma: true
    years_to_maturity_lt: 5
  formula:
    type: percentage_of_market_value
    rate: 0.02
  notes: >-
    GNMA pass-throughs are backed by the full faith and credit of the US Government. Margin rates follow
    the government securities schedule under 4210(e)(2)(D). 2% for average life under 5 years.
