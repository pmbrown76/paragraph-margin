- id: 4210_agency_tba
  description: TBA (To-Be-Announced) mortgage-backed security
  citation: FINRA 4210(e)(2)(D)
  source_quote: >-
    (D) Baskets Notwithstanding the other provisions of this Rule, a member may clear and carry basket
    transactions of one or more members registered as market makers (who are deemed specialists for purposes
