    or, in the absence thereof, by the carrying member when computing net capital under SEA Rule 15c3-1
    and, if applicable, Rule 4110(a).
  conditions:
    security_type: agency_debt
    product_type: tba
  formula:
    type: percentage_of_market_value
    rate: 0.03
  notes: >
    TBA securities require 3% margin. Additional margin of 1% per $100 price change from par may be required
    by house rules for mark-to-market exposure.
