- id: 4210_b_4
  description: (4) equity of at least $2,000 except that cash need not be deposited in excess of the cost of any security
    purchased (th
  citation: FINRA 4210(b)(4)
  source_quote: (4) equity of at least $2,000 except that cash need not be deposited in excess of the cost of any security
    purchased (this equity and cost of purchase provision shall not apply to "when distributed" securities in a cash account).
    The minimum equity requirement for a "pattern day trader" is $25,000 pursuant to paragraph (f)(8)(B)(iv)a. of this Rule.
    Withdrawals of cash or securities may be made from any account which has a debit balance, "short" position or commitments,
    provided it is in compliance with Regulation T and Rules 400 through 406 of SEC Customer Margin Requirements for Security
    Futures and Rules 41.42 through 41.49 under the CEA, and after such withdrawal the equity in the account is at least the
    greater of $2,000 ($25,000 in the case of a "pattern day trader") or an amount sufficient to meet the maintenance margin
    requirements of this Rule.
  conditions:
    account_type: margin
  formula:
    type: account_minimum
    amount: 2000.0
    description: Minimum equity of $2,000 for margin accounts; $25,000 for pattern day traders
  type: account_minimum
  value: 2000.0
  produces_calculation: true
  calculation_status: active
