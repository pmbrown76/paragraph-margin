  description: (b) Initial Margin
  citation: FINRA 4210(b)
  source_quote: '(b) Initial Margin For the purpose of effecting new securities transactions and commitments, the customer
    shall be required to deposit margin in cash and/or securities in the account which shall be at least the greater of: (b)
    Members of limited size and resources that do not have a credit risk officer or credit risk committee may designate an
    appropriately registered principal to make the risk limit determinations;'
  conditions: {}
  formula:
    type: informational
