- id: 4210_e_6_B_i_a._a
  description: a. maintain a minimum tentative net capital (as such term is defined in SEA Rule 15c3-1) of $25 million as
    computed purs
  citation: FINRA 4210(e)(6)(B)(i)(a.)
  source_quote: 'a. maintain a minimum tentative net capital (as such term is defined in SEA Rule 15c3-1) of $25 million as
    computed pursuant to SEA Rule 15c3-1 and, if applicable, Rule 4110(a), except that a member whose primary business consists
    of the clearance of options market-maker accounts may carry JBO accounts provided that it maintains a minimum net capital
    of $7 million as computed pursuant to SEA Rule 15c3-1 and, if applicable, Rule 4110(a). In addition, the member must include
    in its ratio of gross options market maker deductions to net capital required by the provisions of SEA Rule 15c3-1 and,
    if applicable, Rule 4110(a), gross deductions for JBO participant accounts. Clearance of option market maker accounts
    shall be deemed a broker-dealer''s primary business if a minimum of 60 percent of the aggregate deductions in the above
    ratio are options market maker deductions. In the event that a carrying and clearing, or a carrying member''s tentative
    net capital (as such term is defined in SEA Rule 15c3-1), or net capital, respectively, has fallen below the above requirements,
    the firm shall: 1. promptly notify FINRA in writing of such deficiency, 2.'
  conditions:
    account_type: jbo
  formula:
    type: account_minimum
    amount: 25000000.0
    description: JBO arrangement requires minimum tentative net capital of $25 million (or $7 million for options clearing
      members)
  produces_calculation: true
  calculation_status: active
- id: 4210_e_6_B_ii_c._c
  description: c. maintain a minimum liquidating equity of $1 million in the JBO arrangement exclusive of the ownership interest
    establ
  citation: FINRA 4210(e)(6)(B)(ii)(c.)
  source_quote: c. maintain a minimum liquidating equity of $1 million in the JBO arrangement exclusive of the ownership interest
    established in subparagraph (ii)b. above. When the minimum liquidating equity decreases below the $1 million requirement,
    the participant must deposit a sufficient amount to eliminate this deficiency within 5 business days or be subject to
    margin account requirements prescribed for customers in Regulation T, and the margin requirements pursuant to the other
    provisions of this Rule.
  conditions:
    account_type: jbo
  formula:
    type: account_minimum
    amount: 1000000.0
    description: JBO participants must maintain minimum liquidating equity of $1 million
  produces_calculation: true
  calculation_status: active
