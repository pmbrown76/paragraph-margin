- id: 4210_e_2_H_ii_d._2._d_2
  description: 2. if the member has any non-margin counterparties, the member shall establish and enforce risk management
    procedures re
  citation: FINRA 4210(e)(2)(H)(ii)(d.)(2.)
  source_quote: 2. if the member has any non-margin counterparties, the member shall establish and enforce risk management
    procedures reasonably designed to ensure that the member would not exceed either of the limits specified in paragraph
    (e)(2)(I)(i) of this Rule and that the member’s net capital deductions under paragraph (e)(2)(H)(ii)d.1. of this Rule
    for all accounts combined will not exceed $25 million;
  conditions: {}
  formula:
    type: informational
    description: Members with non-margin counterparties must enforce risk management procedures ensuring net capital deduction
      limits per (e)(2)(I)(i) are not exceeded
  produces_calculation: false
  calculation_status: informational
- id: 4210_e_2_H_ii_d._3._d_3
  description: 3. if the member’s specified net capital deductions exceed $25 million for five consecutive business days,
    the member sh
  citation: FINRA 4210(e)(2)(H)(ii)(d.)(3.)
  source_quote: 3. if the member’s specified net capital deductions exceed $25 million for five consecutive business days,
    the member shall give prompt written notice to FINRA. If the member’s specified net capital deductions exceed the lesser
    of $30 million or 25% of the member’s tentative net capital, as such term is defined in SEA Rule 15c3-1, for five consecutive
    business days, the member shall not enter into any new Covered Agency Transactions with any non-margin counterparty other
    than risk-reducing transactions, and shall also, to the extent of its rights, promptly collect margin for each counterparty’s
    excess net mark to market loss and promptly liquidate the Covered Agency Transactions of any counterparty whose excess
    net mark to market loss is not margined or eliminated within five business days from the date it arises, unless FINRA
    has specifically granted the member additional time; and
  conditions: {}
  formula:
    type: informational
    description: Net capital deductions exceeding $25M for 5 days triggers FINRA notice; exceeding lesser of $30M or 25% of
      tentative net capital triggers margin/deposit requirements
  produces_calculation: false
  calculation_status: informational
- id: 4210_e_2_I_i
  description: (i) the net capital deductions taken by a member as a result of marked to the market losses incurred under
    paragraphs (e
  citation: FINRA 4210(e)(2)(I)(i)
  source_quote: '(i) the net capital deductions taken by a member as a result of marked to the market losses incurred under
    paragraphs (e)(2)(F), (e)(2)(G) (exclusive of the percentage requirements established thereunder), or (e)(2)(H)(ii)d.1.
    of this Rule, plus any unmargined net mark to market losses below $250,000 or of small cash counterparties exceed:'
  conditions: {}
  formula:
    type: informational
    description: Net capital deductions from covered agency transactions plus unmargined losses below $250,000 must not exceed
      limits per account (5%) or combined (25%)
  produces_calculation: false
  calculation_status: informational
- id: 4210_e_2_I_i_a._a
  description: a. for any one account or group of commonly controlled accounts, 5 percent of the member's tentative net capital
    (as suc
  citation: FINRA 4210(e)(2)(I)(i)(a.)
  source_quote: a. for any one account or group of commonly controlled accounts, 5 percent of the member's tentative net capital
    (as such term is defined in SEA Rule 15c3-1), or
  conditions: {}
  formula:
    type: concentration_threshold
    rate: 0.05
    description: 'Per-account limit: covered agency net capital deductions may not exceed 5% of tentative net capital'
  produces_calculation: true
  calculation_status: active
- id: 4210_e_2_I_i_b._b
  description: b. for all accounts combined, 25 percent of the member's tentative net capital (as such term is defined in
    SEA Rule 15c3
  citation: FINRA 4210(e)(2)(I)(i)(b.)
  source_quote: b. for all accounts combined, 25 percent of the member's tentative net capital (as such term is defined in
    SEA Rule 15c3-1); and
  conditions: {}
  formula:
    type: concentration_threshold
    rate: 0.25
    description: 'All-accounts limit: covered agency net capital deductions may not exceed 25% of tentative net capital'
  produces_calculation: true
