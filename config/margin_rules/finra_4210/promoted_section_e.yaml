- id: 4210_e_7_C
  description: (C) the amount of any deficiency between the equity in the account and the margin required by the other provisions
    of th
  citation: FINRA 4210(e)(7)(C)
  source_quote: (C) the amount of any deficiency between the equity in the account and the margin required by the other provisions
    of this Rule shall be charged against the member's net capital as provided in SEA Rule 15c3-1 and, if applicable, Rule
    4110(a). The term "nonpurpose credit" means an extension of credit other than "purpose credit" as defined in Section 220.2
    of Regulation T.
  conditions: {}
  formula:
    type: informational
    description: Computational rule — needs margin formula implementation
  produces_calculation: false
  calculation_status: informational
- id: 4210_e_8_A
  description: (A) Shelf-Registered Securities — The equity to be maintained in margin accounts of customers for securities
    which are t
  citation: FINRA 4210(e)(8)(A)
  source_quote: '(A) Shelf-Registered Securities — The equity to be maintained in margin accounts of customers for securities
    which are the subject of a current and effective registration for a continuous or delayed offering (shelf-registered securities)
    shall be at least the amount of margin required by paragraph (c) of this Rule, provided the member:'
  conditions: {}
  formula:
    type: informational
    description: Computational rule — needs margin formula implementation
  produces_calculation: false
  calculation_status: informational
- id: 4210_e_8_B
  description: (B) Other Control and Restricted Securities — Except as provided in subparagraph (D) below, the equity in accounts
    of cu
  citation: FINRA 4210(e)(8)(B)
  source_quote: '(B) Other Control and Restricted Securities — Except as provided in subparagraph (D) below, the equity in
    accounts of customers for other control and restricted securities of issuers that are subject to Securities Act Rule 144
    or 145(c), shall be 40 percent of the current market value of such securities "long" in the account, provided the member:'
  conditions:
    security_type: restricted
    position_side: long
  formula:
    type: percentage_of_market_value
    rate: 0.4
    description: 'Control and restricted securities (Rule 144/145(c)): 40% of current market value'
  produces_calculation: true
  calculation_status: active
- id: 4210_e_8_C_ii
  description: (ii) The greater of the aggregate credit agreed to be extended in writing or the aggregate credit that is actually
    exten
  citation: FINRA 4210(e)(8)(C)(ii)
  source_quote: (ii) The greater of the aggregate credit agreed to be extended in writing or the aggregate credit that is
    actually extended to all customers on control and restricted securities of any one issue that exceeds 10 percent of the
    member's excess net capital shall be deducted from net capital for purposes of determining a member's status under Rule
    4120. The amount of such aggregate credit extended, which has been deducted in computing net capital under SEA Rule 15c3-1
    and, if applicable, Rule 4110(a), need not be included in this calculation. FINRA, upon written application, may reduce
    the deduction to net capital under Rule 4120 to 25 percent of such aggregate credit extended that exceeds 10 percent but
    is less than 15 percent of the member's excess net capital.
  conditions:
    security_type: restricted
  formula:
    type: concentration_threshold
    rate: 0.1
    description: Aggregate credit on control/restricted securities of one issue exceeding 10% of excess net capital requires
      net capital deduction
  produces_calculation: true
  calculation_status: active
- id: 4210_e_8_C_iii_a._a
  description: a. To the extent such net amount of credit extended does not exceed 50 percent of a member's excess net capital,
    25 perc
  citation: FINRA 4210(e)(8)(C)(iii)(a.)
  source_quote: a. To the extent such net amount of credit extended does not exceed 50 percent of a member's excess net capital,
    25 percent of such net amount of credit extended shall be deducted, and
  conditions:
    security_type: restricted
  formula:
    type: percentage_of_market_value
    rate: 0.25
    description: 'Net credit on restricted securities up to 50% of excess net capital: 25% net capital deduction'
  produces_calculation: true
  calculation_status: active
- id: 4210_e_8_C_iii_b._b
  description: 'b. 100 percent of such net amount of credit extended which exceeds 50 percent of a member''s excess net capital
    shall be '
  citation: FINRA 4210(e)(8)(C)(iii)(b.)
  source_quote: b. 100 percent of such net amount of credit extended which exceeds 50 percent of a member's excess net capital
    shall be deducted.
  conditions:
    security_type: restricted
  formula:
    type: percentage_of_market_value
    rate: 1.0
    description: 'Net credit on restricted securities exceeding 50% of excess net capital: 100% net capital deduction on the
      excess'
  produces_calculation: true
  calculation_status: active
- id: 4210_e_8_C_iv_a._a
  description: a. 10 percent of the outstanding shares of such issue, or
  citation: FINRA 4210(e)(8)(C)(iv)(a.)
  source_quote: a. 10 percent of the outstanding shares of such issue, or
  conditions:
    security_type: restricted
  formula:
    type: concentration_threshold
    rate: 0.1
    description: 'Concentration in restricted securities: credit exceeds 10% of outstanding shares of the issue'
  produces_calculation: true
  calculation_status: active
- id: 4210_e_8_C_iv_b._b
  description: b. 100 percent of the average weekly volume for such issue during the preceding three-month period.
  citation: FINRA 4210(e)(8)(C)(iv)(b.)
  source_quote: 'b. 100 percent of the average weekly volume for such issue during the preceding three-month period. Where
    a concentration exists, for purposes of computing subparagraph (B)(i) above, the margin requirement on such securities
    shall be, based on the greater of subparagraph (iv)a. or b., above, as specified below: Percent of Outstanding Shares
    or Percent of Average Weekly Volume Margin Requirement For purposes of this paragraph (e)(8)(C)(iv), "excess securities"
    shall mean the amount of securities, if any, by which the aggregate position in control and restricted securities of any
    one issue exceeds the aggregate amount of securities that would be required to support the aggregate credit extended on
    such control and restricted securities if the applicable margin requirement were 50 percent.'
  conditions: {}
  formula:
    type: informational
    description: Concentration defined as credit on restricted securities exceeding 100% of average weekly volume for the
      preceding 3-month period
  produces_calculation: false
  calculation_status: informational
- id: 4210_e_8_C_v
  description: (v) The amount to be deducted from net capital for purposes of determining a member's status under Rule 4120,
    pursuant t
  citation: FINRA 4210(e)(8)(C)(v)
  source_quote: (v) The amount to be deducted from net capital for purposes of determining a member's status under Rule 4120,
    pursuant to paragraph (e)(8)(C) shall not exceed 100 percent of the aggregate credit extended reduced by any amount deducted
    in computing net capital under SEA Rule 15c3-1 and, if applicable, Rule 4110(a).
  conditions:
    security_type: restricted
  formula:
    type: percentage_of_market_value
    rate: 1.0
    description: Net capital deduction for restricted securities shall not exceed 100% of aggregate credit extended
  produces_calculation: true
  calculation_status: active
