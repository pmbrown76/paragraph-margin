- id: 4210_f_8_B_iv_a._a
  description: a. Minimum Equity Requirement for Pattern Day Traders — The minimum equity required for the accounts of customers
    deemed
  citation: FINRA 4210(f)(8)(B)(iv)(a.)
  source_quote: a. Minimum Equity Requirement for Pattern Day Traders — The minimum equity required for the accounts of customers
    deemed to be pattern day traders shall be $25,000. This minimum equity must be deposited in the account before such customer
    may continue day trading and must be maintained in the customer's account at all times.
  conditions:
    account_type: pattern_day_trader
  formula:
    type: account_minimum
    amount: 25000.0
    description: 'Pattern day trader minimum equity: $25,000; must be deposited before day trading and maintained at all times'
  produces_calculation: true
  calculation_status: active
- id: 4210_f_8_B_iv_b._b
  description: b. In the event that the member at which a customer seeks to open an account or resume day trading in an existing
    accoun
  citation: FINRA 4210(f)(8)(B)(iv)(b.)
  source_quote: b. In the event that the member at which a customer seeks to open an account or resume day trading in an existing
    account, knows or has a reasonable basis to believe that the customer will engage in pattern day trading, then the minimum
    equity required under subparagraph (iv)a. above ($25,000) must be deposited in the account prior to commencement of day
    trading.
  conditions:
    account_type: pattern_day_trader
  formula:
    type: account_minimum
    amount: 25000.0
    description: PDT minimum equity must be in account before day trading begins if member knows or has reasonable basis to
      believe customer will day trade
  produces_calculation: true
  calculation_status: active
