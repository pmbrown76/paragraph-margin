- id: 4210_f_2_E_i
  description: (i) In the case of listed puts and calls, 100 percent of the current market value of the option plus the percentage
    of t
  citation: FINRA 4210(f)(2)(E)(i)
  source_quote: (i) In the case of listed puts and calls, 100 percent of the current market value of the option plus the percentage
    of the current market value of the underlying component specified in column II of the chart below. In the case of currency
    warrants, currency index warrants and stock index warrants, 100 percent of the current market value of each such warrant
    plus the percentage of the warrant's current "underlying component value" (as column IV of the chart below describes)
    specified in column II of the chart below. The margin on any listed put, call, currency warrant, currency index warrant,
    or stock index warrant carried "short" in a customer's account may be reduced by any "out-of-the-money amount" (as defined
    below), but shall not be less than 100 percent of the current market value of the option or warrant plus the percentage
    of the current market value of the underlying component specified in column III, except in the case of any listed put
    carried "short" in a customer's account.
  conditions:
    security_type: option
    option_listed: true
  formula:
    type: naked_option
    premium_pct: 1.0
    underlying_pct: 0.2
    minimum_underlying_pct: 0.1
    description: 'Listed options: 100% of premium + underlying % per chart; warrants: 100% of market value + underlying %'
  produces_calculation: true
  calculation_status: active
- id: 4210_f_2_E_ii
  description: (ii) In the case of listed puts and calls which represent options on GNMA obligations in the principal amount
    of $100,00
  citation: FINRA 4210(f)(2)(E)(ii)
  source_quote: (ii) In the case of listed puts and calls which represent options on GNMA obligations in the principal amount
    of $100,000, 130 percent of the current market value of the option plus $1,500, except that the margin required need not
    exceed $5,000 plus the current market value of the option.
  conditions:
    security_type: option
    underlying_type: gnma
  formula:
    type: naked_option
    premium_pct: 1.3
    underlying_pct: 0.0
    amount: 1500.0
    description: 'GNMA options: 130% of option market value + $1,500; max = $5,000 + option market value'
  produces_calculation: true
  calculation_status: active
- id: 4210_f_2_E_iii
  description: (iii) In the case of OTC puts and calls, the percentage of the current value of the underlying component and
    the applica
  citation: FINRA 4210(f)(2)(E)(iii)
  source_quote: '(iii) In the case of OTC puts and calls, the percentage of the current value of the underlying component
    and the applicable multiplier, if any, specified in column II below, plus any "in-the-money amount" (as defined in this
    paragraph (f)(2)(E)(iii)). In the case of OTC options, the margin on any put or call carried "short" in a customer''s
    account may be reduced by any "out-of-the-money amount" (as defined in paragraph (f)(2)(E)(i)), but shall not be less
    than the percentage of the current value of the underlying component and the applicable multiplier, if any, specified
    in column III below, except in the case of any OTC put carried "short" in a customer''s account. Margin on such put option
    contracts shall not be less than the percentage of the put option''s exercise price as specified in column III below.
    Type of Option * Option contracts under category (4) must be for a principal amount of not less than $500,000. For the
    purpose of this paragraph (f)(2)(E)(iii), "in-the-money amounts" are determined as follows: Option Issue'
  conditions:
    security_type: option
    option_listed: false
  formula:
    type: naked_option
    premium_pct: 1.0
    description: 'OTC options: underlying % per chart + in-the-money amount; put/call on same underlying may not exceed margin
      on underlying'
  produces_calculation: true
  calculation_status: active
- id: 4210_f_2_E_iv
  description: '(iv) OTC puts and calls representing options on U.S. Government and U.S. Government Agency debt securities
    that qualify '
  citation: FINRA 4210(f)(2)(E)(iv)
  source_quote: '(iv) OTC puts and calls representing options on U.S. Government and U.S. Government Agency debt securities
    that qualify for exemption pursuant to SEA Rule 3a12-7, must be for a principal amount of not less than $500,000, and
    shall be subject to the following requirements:'
  conditions:
    security_type: option
    underlying_type: government_debt
  formula:
    type: informational
    description: 'OTC options on US Government/Agency debt (Rule 3a12-7 exempt): minimum $500,000 principal amount; margin
      per (iv)(a) exempt accounts or (iv)(b) non-exempt'
  produces_calculation: false
  calculation_status: informational
- id: 4210_f_2_E_iv_a._a
  description: a. For exempt accounts, as defined in paragraph (a)(13), 3 percent of the current value of the underlying principal
    amou
  citation: FINRA 4210(f)(2)(E)(iv)(a.)
  source_quote: 'a. For exempt accounts, as defined in paragraph (a)(13), 3 percent of the current value of the underlying
    principal amount on thirty (30) year U.S. Treasury bonds and non-mortgage backed U.S. Government agency debt securities;
    and 2 percent of the current value of the underlying principal amount on all other U.S. Government and U.S. Government
    agency debt securities, plus any "in-the-money amount" (as defined in paragraph (f)(2)(E)(iii)) or minus any "out-of-the-money
    amount" (as defined in paragraph (f)(2)(E)(i)). The amount of any deficiency between the equity in the account and the
    margin required shall be deducted in computing the net capital of the member under SEA Rule 15c3-1 and, if applicable,
    Rule 4110(a), on the following basis:'
  conditions:
    security_type: option
    underlying_type: government_debt
    exempt_account: true
  formula:
    type: percentage_of_principal
    rate: 0.03
    description: 'Exempt account OTC govt options: 3% for 30yr Treasury/agency; 2% for other govt; 0.5% for 4yr or less'
  produces_calculation: true
  calculation_status: active
- id: 4210_f_2_E_iv_a._1._a_1
  description: 1. On any one account or group of commonly controlled accounts to the extent such deficiency exceeds 5 percent
    of a memb
  citation: FINRA 4210(f)(2)(E)(iv)(a.)(1.)
  source_quote: 1. On any one account or group of commonly controlled accounts to the extent such deficiency exceeds 5 percent
    of a member's tentative net capital (as such term is defined in SEA Rule 15c3-1), 100 percent of such excess amount, and
  conditions: {}
  formula:
    type: concentration_threshold
    rate: 0.05
    description: 'OTC govt option deficiency on one account exceeding 5% of tentative net capital: 100% net capital deduction
      on excess'
  produces_calculation: true
  calculation_status: active
- id: 4210_f_2_E_iv_a._2._a_2
  description: 2. On all accounts combined to the extent such deficiency exceeds 25 percent of a member's tentative net capital
    (as suc
  citation: FINRA 4210(f)(2)(E)(iv)(a.)(2.)
  source_quote: 2. On all accounts combined to the extent such deficiency exceeds 25 percent of a member's tentative net capital
    (as such term is defined in SEA Rule 15c3-1), 100 percent of such excess amount, reduced by any amount already deducted
    pursuant to subparagraph (a) above.
  conditions: {}
  formula:
    type: concentration_threshold
    rate: 0.25
    description: 'OTC govt option deficiency on all accounts exceeding 25% of tentative net capital: 100% net capital deduction
      on excess'
  produces_calculation: true
  calculation_status: active
- id: 4210_f_2_E_iv_b._b
  description: b. For non-exempt accounts, 5 percent of the current value of the underlying principal amount on thirty (30)
    year U.S. T
  citation: FINRA 4210(f)(2)(E)(iv)(b.)
  source_quote: b. For non-exempt accounts, 5 percent of the current value of the underlying principal amount on thirty (30)
    year U.S. Treasury bonds and non-mortgage backed U.S. Government agency debt securities; and 3 percent of the current
    value of the underlying principal amount on all other U.S. Government and U.S. Government agency debt securities, plus
    any "in-the-money amount" or minus any "out-of-the-money amount," provided the minimum margin shall not be less than 1
    percent of the current value of the underlying principal amount.
  conditions:
    security_type: option
    underlying_type: government_debt
    exempt_account: false
  formula:
    type: percentage_of_principal
    rate: 0.05
    description: 'Non-exempt OTC govt options: 5% for 30yr Treasury/agency; 3% for other govt; 1% for 4yr or less'
  produces_calculation: true
  calculation_status: active
