  citation: FINRA 4210(f)(2)(E)
  source_quote: '(E) The margin required on any listed or OTC put, call, currency warrant, currency index warrant, or stock
    index warrant carried "short" in a customer''s account shall be:'
  conditions: {}
  formula:
    type: informational
    description: Computational rule — needs margin formula implementation
