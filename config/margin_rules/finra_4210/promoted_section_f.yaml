rule_set:
  regulation: FINRA Rule 4210
  authority: FINRA
  section: f
  description: FINRA 4210(f) — Other Provisions (promoted from stubs)
rules:
- id: 4210_f_1
  description: (1) Determination of Value for Margin Purposes
  citation: FINRA 4210(f)(1)
  source_quote: (1) Determination of Value for Margin Purposes Active securities dealt in on a national securities exchange
    shall, for margin purposes, be valued at current market prices provided that only those options contracts on a stock or
    stock index, or a stock index warrant, having an expiration that exceeds nine months and that are listed or OTC (as defined
    in this Rule), may be deemed to have market value for the purposes of this Rule. Other securities shall be valued conservatively
    in view of current market prices and the amount that might be realized upon liquidation. Substantial additional margin
    must be required in all cases where the securities carried in "long" or "short" positions are subject to unusually rapid
    or violent changes in value, or do not have an active market on a national securities exchange, or where the amount carried
    is such that the position(s) cannot be liquidated promptly.
  conditions: {}
  formula:
    type: informational
    description: (1) Determination of Value for Margin Purposes
  produces_calculation: false
  calculation_status: informational
- id: 4210_f_10_B_i
  description: (i) General Rule. As set forth in paragraphs (b) and (c) of this Rule, the minimum initial and maintenance
    margin levels
  citation: FINRA 4210(f)(10)(B)(i)
  source_quote: (i) General Rule. As set forth in paragraphs (b) and (c) of this Rule, the minimum initial and maintenance
    margin levels for each security futures contract, long and short, shall be 20 percent of the current market value of such
    contract.
  conditions:
    security_type: security_future
  formula:
    type: percentage_of_market_value
    rate: 0.2
    description: 'Security futures contracts: 20% initial and maintenance margin of current market value'
  produces_calculation: true
  calculation_status: active
- id: 4210_f_10_G_ii
  description: (ii) Day trading of security futures is subject to the minimum requirements of this Rule. If deemed a pattern
    day trader
  citation: FINRA 4210(f)(10)(G)(ii)
  source_quote: (ii) Day trading of security futures is subject to the minimum requirements of this Rule. If deemed a pattern
    day trader, the customer must maintain equity of $25,000. The 20 percent requirement, for security futures contracts,
    should be calculated based on the greater of the initial or closing transaction and any amount exceeding FINRA excess
    must be collected. The creation of a customer call subjects the account to all the restrictions contained in paragraph
    (f)(8)(B) of this Rule.
  conditions:
    security_type: security_future
    day_trade: true
  formula:
    type: percentage_of_market_value
    rate: 0.2
    description: 'Security futures day trading: 20% maintenance; $25,000 minimum equity for PDT'
  produces_calculation: true
  calculation_status: active
- id: 4210_f_2_A_i
  description: (i) The term "aggregate discount amount" as used with reference to a Treasury bill option contract means the
    principal a
  citation: FINRA 4210(f)(2)(A)(i)
  source_quote: (i) The term "aggregate discount amount" as used with reference to a Treasury bill option contract means the
    principal amount of the underlying Treasury bill (A) multiplied by the annualized discount (i.e., 100 percent minus the
    exercise price of the option contract) and (B) further multiplied by a fraction having a numerator equal to the number
    of days to maturity of the underlying Treasury bill on the earliest date on which it could be delivered pursuant to the
    rules of The Options Clearing Corporation in connection with the exercise of the option (normally 91 or 182 days) and
    a denominator of 360.
  conditions:
    security_type: definitions_reference
  formula:
    type: informational
    description: Aggregate discount amount = principal × annualized discount (100% - exercise price) × (days to maturity /
      360)
  produces_calculation: false
  calculation_status: informational
- id: 4210_f_2_A_xxv
  description: (xxv) The term "nominal principal amount" as used with reference to a GNMA option means the remaining unpaid
    principal b
  citation: FINRA 4210(f)(2)(A)(xxv)
  source_quote: (xxv) The term "nominal principal amount" as used with reference to a GNMA option means the remaining unpaid
    principal balance of GNMAs required to be delivered to the holder of a call or by the holder of a put upon exercise of
    an option without regard to any variance in the remaining unpaid principal balance permitted to be delivered upon such
    exercise and shall be $100,000 in the case of a single call or put.
  conditions:
    security_type: definitions_reference
  formula:
    type: informational
    description: Nominal principal amount for GNMA options = remaining unpaid principal of GNMAs for delivery, minimum $100,000
  produces_calculation: false
  calculation_status: informational
- id: 4210_f_2_A_xxxii
  description: (xxxii) The term "spread" means a "long" and "short" position in different call option series, different put
    option seri
  citation: FINRA 4210(f)(2)(A)(xxxii)
  source_quote: (xxxii) The term "spread" means a "long" and "short" position in different call option series, different put
    option series, or a combination of call and put option series, that collectively have a limited risk / reward profile,
    and meet the following conditions;
  conditions: {}
  formula:
    type: informational
    description: (xxxii) The term "spread" means a "long" and "short" position in different call option series, different
      put option seri
  produces_calculation: false
  calculation_status: informational
- id: 4210_f_2_D
  description: (D) For purposes of this paragraph (f)(2), obligations issued by the United States Government shall be referred
    to as Un
  citation: FINRA 4210(f)(2)(D)
  source_quote: (D) For purposes of this paragraph (f)(2), obligations issued by the United States Government shall be referred
    to as United States Government obligations. Mortgage pass-through obligations guaranteed as to timely payment of principal
    and interest by the Government National Mortgage Association shall be referred to as GNMA obligations. In the case of
    any put, call, currency warrant, currency index warrant, or stock index warrant carried "long" in a customer's account
    that expires in nine months or less, initial margin must be deposited and maintained equal to at least 100 percent of
    the purchase price of the option or warrant. "Long" Listed Option or Warrant With An Expiration Exceeding Nine Months.
    In the case of a listed put, call, index stock group option, or stock index warrant carried "long", margin must be deposited
    and maintained equal to at least 75 percent of the current market value of the option or warrant; provided that the option
    or warrant has a remaining period to expiration exceeding nine months. "Long" Listed Option or Warrant With An Expiration
    Exceeding Nine Months. "Long" OTC Option or Warrant With An Expiration Exceeding Nine Months.
  conditions:
    security_type: government_debt
  formula:
    type: informational
    description: US Government obligations include GNMAs at 100% of unpaid principal; FHLMC PCs valued at 75% of comparable
      GNMAs
  produces_calculation: false
  calculation_status: informational
