- id: 4210_f_8_B_ii
  description: (ii) The term "pattern day trader" means any customer who executes four or more day trades within five business
    days. Ho
  citation: FINRA 4210(f)(8)(B)(ii)
  source_quote: (ii) The term "pattern day trader" means any customer who executes four or more day trades within five business
    days. However, if the number of day trades is 6 percent or less of total trades for the five business day period, the
    customer will not be considered a pattern day trader and the special requirements under paragraph (f)(8)(B)(iv) of this
    Rule will not apply. In the event that the member at which a customer seeks to open an account or to resume day trading
    knows or has a reasonable basis to believe that the customer will engage in pattern day trading, then the special requirements
    under paragraph (f)(8)(B)(iv) of this Rule will apply.
  conditions:
    account_type: margin
  formula:
    type: informational
    description: Pattern day trader = 4+ day trades in 5 business days, unless <= 6% of total trades
  produces_calculation: false
  calculation_status: informational
- id: 4210_f_8_B_iii
  description: (iii) The term "day-trading buying power" means the equity in a customer's account at the close of business
    of the previ
  citation: FINRA 4210(f)(8)(B)(iii)
  source_quote: (iii) The term "day-trading buying power" means the equity in a customer's account at the close of business
    of the previous day, less any maintenance margin requirement as prescribed in paragraph (c) of this Rule, multiplied by
    four for equity securities. The day-trading buying power for non-equity securities may be computed using the applicable
    special maintenance margin requirements pursuant to other provisions of this Rule. Whenever day trading occurs in a customer's
    margin account the special maintenance margin required, based on the cost of all the day trades made during the day, shall
    be 25 percent for margin eligible equity securities, and 100 percent for non-margin eligible equity securities. For non-equity
    securities, the special maintenance margin shall be as required pursuant to the other provisions of this Rule. Alternatively,
    when two or more day trades occur on the same day in the same customer's account, the margin required may be computed
    utilizing the highest (dollar amount) open position during that day. To utilize the highest open position computation
    method, a record showing the "time and tick" of each trade must be maintained to document the sequence in which each day
    trade was completed.
  conditions:
    account_type: pattern_day_trader
  formula:
    type: buying_power_multiplier
    multiplier: 4.0
    description: Day-trading buying power = (equity - maintenance requirement) x 4 for equity securities
  produces_calculation: true
  calculation_status: active
