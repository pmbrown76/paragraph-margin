- id: 4210_f_2_G_iii
  description: '(iii) If both a put and call for the same GNMA obligation in the principal amount of $100,000 are listed or
    OTC and are '
  citation: FINRA 4210(f)(2)(G)(iii)
  source_quote: (iii) If both a put and call for the same GNMA obligation in the principal amount of $100,000 are listed or
    OTC and are carried "short" for a customer, the amount of margin required shall be the margin on the put or call, whichever
    is greater, as required pursuant to paragraph (f)(2)(E)(ii) above, plus the current market value of the other option.
  conditions:
    security_type: option
    underlying_type: gnma
  formula:
    type: informational
    description: 'GNMA straddle: margin = greater of put or call margin per (f)(2)(E)(ii), plus other side premium; principal
      amount $100,000'
  produces_calculation: false
  calculation_status: informational
- id: 4210_f_2_I_iv
  description: (iv) Where a listed or OTC put or call option or stock index warrant is carried "short" in the account of a
    customer, ag
  citation: FINRA 4210(f)(2)(I)(iv)
  source_quote: (iv) Where a listed or OTC put or call option or stock index warrant is carried "short" in the account of
    a customer, against an escrow agreement, that is in a form satisfactory to FINRA, is issued by a third party custodian
    bank or trust company (the "custodian"), either is held in the account at the time the put or call is written, or is received
    in the account promptly thereafter, and is in compliance with the requirements of Rule 610 of The Options Clearing Corporation,
    no margin need be required on the put or call. In the case of a call option or warrant on a broad index stock group, the
    escrow agreement must certify that the custodian holds for the account of the customer as security for the agreement either
    cash, cash equivalents, one or more qualified securities, or any combination thereof, having an aggregate market value,
    computed as at the close of business on the day the call is written, of not less than 100 percent of the aggregate index
    value computed as at the same time and that the custodian will promptly pay the member the exercise settlement amount
    in the event the account is assigned
  conditions:
    security_type: option
    position_side: short
  formula:
    type: informational
    description: 'Short options carried against escrow agreement from custodian bank: 100% of underlying deposited — no additional
      margin required'
  produces_calculation: false
  calculation_status: informational
- id: 4210_f_3_A
  description: (A) Margin Accounts
  citation: FINRA 4210(f)(3)(A)
  source_quote: (A) Margin Accounts The margin to be maintained on any transaction or net position in each "when issued" security
    shall be the same as if such security were issued. Each position in a "when issued" security shall be margined separately
    and any unrealized profit shall be of value only in providing the amount of margin required on that particular position.
    When an account has a "short" position in a "when issued" security and there are held in the account securities upon which
    the "when issued" security may be issued, such "short" position shall be marked to the market and the balance in the account
    shall for the purpose of this Rule be adjusted for any unrealized loss in such "short" position.
  conditions: {}
  formula:
    type: informational
    description: Computational rule — needs margin formula implementation
  produces_calculation: false
  calculation_status: informational
- id: 4210_f_5
  description: (5) Consolidation of Accounts
  citation: FINRA 4210(f)(5)
  source_quote: (5) Consolidation of Accounts When two or more accounts are carried for a customer, the margin to be maintained
    may be determined on the net position of said accounts, provided the customer has consented that the money and securities
    in each of such accounts may be used to carry or pay any deficit in all such accounts.
  conditions: {}
  formula:
    type: informational
    description: (5) Consolidation of Accounts
  produces_calculation: false
  calculation_status: informational
- id: 4210_f_6
  description: (6) Time Within Which Margin or "Mark to Market" Must Be Obtained
  citation: FINRA 4210(f)(6)
  source_quote: (6) Time Within Which Margin or "Mark to Market" Must Be Obtained The amount of margin or "mark to market"
    required by any provision of this Rule shall be obtained as promptly as possible and in any event within 15 business days
    from the date such deficiency occurred, unless FINRA has specifically granted the member additional time.
  conditions: {}
  formula:
    type: informational
    description: (6) Time Within Which Margin or "Mark to Market" Must Be Obtained
  produces_calculation: false
  calculation_status: informational
- id: 4210_f_7
  description: (7) Practice of Meeting Regulation T Margin Calls by Liquidation Prohibited
  citation: FINRA 4210(f)(7)
  source_quote: (7) Practice of Meeting Regulation T Margin Calls by Liquidation Prohibited When a "margin call," as defined
    in Section 220.2 of Regulation T, is required in a customer's account, no member shall permit a customer to make a practice
    of either deferring the deposit of cash or securities beyond the time when such transactions would ordinarily be settled
    or cleared, or meeting the margin required by the liquidation of the same or other commitments in the account. This prohibition
    on liquidations shall not apply (i) to those accounts that, at the time of liquidation, are in compliance with the equity
    to be maintained pursuant to the provisions of this Rule or (ii) to any account carried on an omnibus basis as prescribed
    by Regulation T.
  conditions: {}
  formula:
    type: informational
    description: Computational rule — needs margin formula implementation
  produces_calculation: false
  calculation_status: informational
