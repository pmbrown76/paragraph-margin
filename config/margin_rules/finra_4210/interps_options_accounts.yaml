  notes: >
    Per 4210(f)(9)/01: if a customer makes a practice of buying securities in a cash account and selling
    them before paying in full, the member must freeze the account for 90 calendar days. During the freeze,
    the customer may only purchase securities if full payment is in the account before the trade. This
    is a Regulation T requirement enforced through 4210.
