    or so
  citation: FINRA 4210(a)(2)
  source_quote: (2) The term "current market value" means the total cost or net proceeds of a security on the day it was purchased
    or sold or at any other time the preceding business day's closing price as shown by any regularly published reporting
    or quotation service except for security futures contracts (see paragraph (f)(10)(C)(ii)). If there is no closing price,
    a member may use a reasonable estimate of the market value of the security as of the close of business on the preceding
    business day.
