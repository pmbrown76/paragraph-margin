- id: 4210_a
  description: (a) Definitions
  citation: FINRA 4210(a)
  source_quote: '(a) Definitions For purposes of this Rule, the following terms shall have the meanings specified below: (a)
    If a member engages in transactions with advisory clients of a registered investment adviser, the member may elect to
    make the risk limit determination at the investment adviser level;'
  category: definitional
  conditions: {}
  formula:
    type: informational
    description: See (a)
- id: 4210_a_1
  description: (1) The term "basket" shall mean a group of stocks that FINRA or any national securities exchange designates
    as eligible
  citation: FINRA 4210(a)(1)
  source_quote: (1) The term "basket" shall mean a group of stocks that FINRA or any national securities exchange designates
    as eligible for execution in a single trade through its trading facilities and that consists of stocks whose inclusion
    and relative representation in the group are determined by the inclusion and relative representation of their current
    market prices in a widely disseminated stock index reflecting the stock market as a whole.
  category: definitional
  conditions: {}
  formula:
    type: informational
    description: See (a)(1)
- id: 4210_a_10
  description: '(10) The term "investment grade debt securities" means any debt securities (including those issued by the
    government of '
  citation: FINRA 4210(a)(10)
  source_quote: (10) The term "investment grade debt securities" means any debt securities (including those issued by the
    government of a foreign country, its provinces, states or cities, or a supranational entity), if at the time of the extension
    of credit the issue, the issuer or guarantor, or any other outstanding obligation of the issuer or guarantor ranked junior
    to or on a parity with the issue or the guarantee is assigned a rating (implicitly or explicitly) in one of the top four
    rating categories by at least one nationally recognized statistical rating organization.
  category: procedural
  conditions: {}
  formula:
    type: TODO_procedural
    description: Margin-related procedure — review for implementation
