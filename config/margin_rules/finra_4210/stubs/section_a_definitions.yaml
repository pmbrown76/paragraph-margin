- id: 4210_a_5
  description: (5) The term "equity" means the customer's ownership interest in the account, computed by adding the current
    market valu
  citation: FINRA 4210(a)(5)
  source_quote: (5) The term "equity" means the customer's ownership interest in the account, computed by adding the current
    market value of all securities "long" and the amount of any credit balance and subtracting the current market value of
    all securities "short" and the amount of any debit balance. Any variation settlement received or paid on a security futures
    contract shall be considered a credit or debit to the account for purposes of equity.
