- id: 4210_e_9
  description: (9) Security-Based Swaps; SBS Offsets
  citation: FINRA 4210(e)(9)
  source_quote: (9) Security-Based Swaps; SBS Offsets Except for SBS carried by a member in a portfolio margin account subject
    to the requirements of Rule 4210(g), margin requirements on SBS and positions in Uncleared SBS Accounts are determined
    by Rule 4240, rather than Rule 4210. When one or more securities or options positions in a customer’s margin account are
    included in a combination of SBS, securities or options positions on which an Initial Margin Requirement is computed under
    paragraph (b)(2)(A)(i) or (b)(2)(A)(ii) of Rule 4240, and the Initial Margin Requirement computed on the combination is
    less than the aggregate margin requirement on such securities or options positions under other provisions of this Rule,
    the aggregate margin requirement on such margin account positions shall be reduced to the Initial Margin Requirement computed
    on the combination. For purposes of this paragraph (e)(9), the terms “SBS,” “Uncleared SBS Account,” and “Initial Margin
    Requirement” have the meanings given them in Rule 4240.
  category: procedural
