- id: 4210_e_2_H_ii_b._b
  description: 'b. Written Risk Limits: A member that engages in Covered Agency Transactions with any counterparty shall make
    a determin'
  citation: FINRA 4210(e)(2)(H)(ii)(b.)
  source_quote: 'b. Written Risk Limits: A member that engages in Covered Agency Transactions with any counterparty shall
    make a determination in writing of a risk limit for each such counterparty, including any counterparty specified in paragraph
    (e)(2)(H)(ii)a.1. of this Rule, that the member shall enforce. The risk limit for a counterparty shall cover all of the
    counterparty’s Covered Agency Transactions with the member or guaranteed to a third party by the member, including Covered
    Agency Transactions specified in paragraph (e)(2)(H)(ii)a.2. of this Rule. The risk limit determination shall be made
    by a designated credit risk officer or credit risk committee in accordance with the member''s written risk policies and
    procedures.'
  category: procedural
  conditions: {}
  formula:
    type: TODO_procedural
    description: Margin-related procedure — review for implementation
