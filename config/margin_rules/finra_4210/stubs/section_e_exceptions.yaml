- id: 4210_e_3
  description: (3) Joint Accounts in Which the Carrying Member or a Partner or Stockholder Therein Has an Interest
  citation: FINRA 4210(e)(3)
  source_quote: '(3) Joint Accounts in Which the Carrying Member or a Partner or Stockholder Therein Has an Interest In the
    case of a joint account carried by a member in which such member, or any partner, or stockholder (other than a holder
    of freely transferable stock only) of such member participates with others, each participant other than the carrying member
    shall maintain an equity with respect to such interest pursuant to the margin provisions of this paragraph as if such
    interest were in a separate account. Pursuant to the Rule 9600 Series, FINRA may grant an exemption from the provisions
    of this paragraph (e)(3), if the account is confined exclusively to transactions and positions in exempted securities.
    In the case of an account conforming to the conditions described in this paragraph (e)(3), the exemption application shall
    also include the following information as of the date of the request:'
