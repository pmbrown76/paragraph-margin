- id: 4210_e_5_A
  description: (A) A member may carry the account of an "approved specialist" or "approved market maker," which account is
    limited to s
  citation: FINRA 4210(e)(5)(A)
  source_quote: '(A) A member may carry the account of an "approved specialist" or "approved market maker," which account
    is limited to specialist or market making transactions, upon a margin basis which is satisfactory to both parties. The
    amount of any deficiency between the equity in the account and the haircut requirements pursuant to SEA Rule 15c3-1 and,
