    is not less than the net capital haircut deduction of the member carrying the transaction pursuant to SEA Rule 15c3-1
    and, if applicable, Rule 4110(a). In lieu of collecting the "Good Faith" margin requirement, a carrying member may elect
    to deduct in computing its net capital the amount of any deficiency between the equity maintained in the account and the
    "Good Faith" margin required. For the purpose of this paragraph (f)(10)(E), the term "approved options specialist" or
    "approved market maker" means a specialist, market maker, or registered trader in options as referenced in paragraph (f)(2)(K)
    of this Rule, who is deemed a specialist for all purposes under the Exchange Act and who is registered pursuant to the
    rules of a national securities exchange.
