- id: 4210_f_4
  description: (4) Guaranteed Accounts
  citation: FINRA 4210(f)(4)
  source_quote: (4) Guaranteed Accounts Any account guaranteed by another account may be consolidated with such other account
    and the margin to be maintained may be determined on the net position of both accounts, provided the guarantee is in writing
    and permits the member carrying the account, without restriction, to use the money and securities in the guaranteeing
    account to carry the guaranteed account or to pay any deficit therein; and provided further that such guaranteeing account
    is not owned directly or indirectly by (i) a member, or any stockholder (other than a holder of freely transferable stock
    only) in the member carrying such account, or (ii) a member, or any stockholder (other than a holder of freely transferable
    stock only) therein having a definite arrangement for participating in the commissions earned on the guaranteed account.
    However, the guarantee of a limited partner or of a holder of non-voting stock, if based upon his resources other than
    his capital contribution to or other than his interest in a member, is not affected by the foregoing prohibition, and
    such a guarantee may be taken into consideration in computing margin to be maintained in the guaranteed account.
  category: computational
