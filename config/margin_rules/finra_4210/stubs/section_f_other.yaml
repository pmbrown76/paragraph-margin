- id: 4210_f_10_B_ii
  description: (ii) Excluded from the Rule's requirements are arrangements between a member and a customer with respect to
    the customer
  citation: FINRA 4210(f)(10)(B)(ii)
  source_quote: (ii) Excluded from the Rule's requirements are arrangements between a member and a customer with respect to
    the customer's financing of proprietary positions in security futures, based on the member's good faith determination
    that the customer is an "Exempted Person," as defined in Rule 401(a)(9) of SEC Customer Margin Requirements for Security
    Futures, and Rule 41.43(a)(9) under the CEA, except for the proprietary account of a broker-dealer carried by a member
    pursuant to paragraph (e)(6)(A) of this Rule. Once a registered broker or dealer, or member of a national securities exchange
    ceases to qualify as an "Exempted Person," it shall notify the member of this fact before establishing any new security
    futures positions. Any new security futures positions will be subject to the provisions of this subparagraph.
  category: procedural
  conditions: {}
  formula:
    type: TODO_procedural
    description: Margin-related procedure — review for implementation
- id: 4210_f_10_B_iii
  description: (iii) Permissible Offsets.
  citation: FINRA 4210(f)(10)(B)(iii)
  source_quote: (iii) Permissible Offsets. Notwithstanding the minimum margin levels specified in paragraph (f)(10)(B)(i)
    of this Rule, customers with offset positions involving security futures and related positions may have initial or maintenance
    margin levels (pursuant to the offset table below) that are lower than the levels specified in paragraph (f)(10)(B)(i)
    of this Rule. Description of Offset Security Underlying the Security Future Initial Margin Requirement Maintenance Margin
    1 Two security futures contracts will be considered "identical" for this purpose if they are issued by the same clearing
    agency or cleared and guaranteed by the same derivatives clearing organization, have identical specifications, and would
    offset each other at the clearing level.
  category: procedural
  conditions: {}
  formula:
    type: TODO_procedural
    description: Margin-related procedure — review for implementation
