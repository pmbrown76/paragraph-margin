- id: 4210_f_3_B
  description: (B) Cash Accounts
  citation: FINRA 4210(f)(3)(B)
  source_quote: '(B) Cash Accounts On any transaction or net position resulting from contracts for a "when issued" security
    in an account other than that of a member, non-member broker-dealer, or a "designated account," equity must be maintained
    equal to the margin required were such transaction or position in a margin account. On any net position resulting from
    contracts for a "when issued" security made for or with a non-member broker-dealer, no margin need be required, but such
    net position must be marked to the market. On any net position resulting from contracts for a "when issued" security made
    for a member or a "designated account," no margin need be required and such net position need not be marked to the market.
    However, where such net position is not marked to the market, an amount equal to the loss at the market in such position
    shall be charged against the member''s net capital as provided in SEA Rule 15c3-1 and, if applicable, Rule 4110(a). The
    provisions of this paragraph (f)(3) shall not apply to any position resulting from contracts on a "when issued" basis
    in a security:'
