- id: 4210_f_10_A
  description: (A) Applicability
  citation: FINRA 4210(f)(10)(A)
  source_quote: (A) Applicability No member may effect a transaction involving, or carry an account containing, a security
    futures contract with or for a customer in a margin account, without obtaining proper and adequate margin as set forth
    in this subparagraph.
