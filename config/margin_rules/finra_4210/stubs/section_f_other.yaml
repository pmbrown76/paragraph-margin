  citation: FINRA 4210(f)(2)(K)(i)
  source_quote: (K)(i) Registered specialists, market makers or traders — Notwithstanding the other provisions of this paragraph
    (f)(2), a member may clear and carry the listed option transactions of one or more registered specialists, registered
    market makers or registered traders in options (whereby registered traders are deemed specialists for all purposes under
    the Exchange Act, pursuant to the rules of a national securities exchange) (hereinafter referred to as "specialist(s)"),
    upon a "Good Faith" margin basis satisfactory to the concerned parties, provided the "Good Faith" margin requirement is
    not less than the net capital haircut deduction of the member carrying the transaction pursuant to SEA Rule 15c3-1 and,
    if applicable, Rule 4110(a). In lieu of collecting the "Good Faith" margin requirement, a carrying member may elect to
    deduct in computing its net capital the amount of any deficiency between the equity maintained in the account and the
    "Good Faith" margin required.
