- id: 4210_f_10_E_iv
  description: (iv) Securities, including options and security futures contracts, in such accounts shall be valued conservatively
    in li
  citation: FINRA 4210(f)(10)(E)(iv)
  source_quote: '(iv) Securities, including options and security futures contracts, in such accounts shall be valued conservatively
    in light of current market prices and the amount that might be realized upon liquidation. Substantial additional margin
    must be required or excess net capital maintained in all cases where the securities carried: (a) are subject to unusually
    rapid or violent changes in value including volatility in the expiration months of options or security futures contracts,
    (b) do not have an active market, or (c) in one or more or all accounts, including proprietary accounts combined, are
    such that they cannot be liquidated promptly or represent undue concentration of risk in view of the carrying member''s
    net capital and its overall exposure to material loss.'
  category: procedural
  conditions: {}
  formula:
    type: TODO_procedural
    description: Margin-related procedure — review for implementation
