- id: 4210_f_10_C_iii
  description: (iii) The term "underlying security" means, in the case of physically settled security futures contracts, the
    security t
  citation: FINRA 4210(f)(10)(C)(iii)
  source_quote: (iii) The term "underlying security" means, in the case of physically settled security futures contracts,
    the security that is delivered upon expiration of the contract, and, in the case of cash settled security futures contracts,
    the security or securities index the price or level of which determines the final settlement price for the security futures
    contract upon its expiration.
  category: procedural
  conditions: {}
  formula:
    type: TODO_procedural
    description: Margin-related procedure — review for implementation
- id: 4210_f_10_C_iv
  description: '(iv) The term "underlying basket" means, in the case of a securities index, a group of security futures contracts
    where '
  citation: FINRA 4210(f)(10)(C)(iv)
  source_quote: '(iv) The term "underlying basket" means, in the case of a securities index, a group of security futures contracts
    where the underlying securities as defined in subparagraph (iii) above include each of the component securities of the
    applicable index and that meets the following conditions: (1) the quantity of each underlying security is proportional
    to its representation in the index, (2) the total market value of the underlying securities is equal to the aggregate
    value of the applicable index, (3) the basket cannot be used to offset more than the number of contracts or warrants represented
    by its total market value, and (4) the security futures contracts shall be unavailable to support any other contract or
    warrant transaction in the account.'
  category: definitional
  conditions: {}
  formula:
    type: informational
    description: See (f)(10)(C)(iv)
- id: 4210_f_10_C_v
  description: (v) The term "underlying stock basket" means a group of securities that includes each of the component securities
    of the
  citation: FINRA 4210(f)(10)(C)(v)
  source_quote: '(v) The term "underlying stock basket" means a group of securities that includes each of the component securities
    of the applicable index and that meets the following conditions: (1) the quantity of each stock in the basket is proportional
    to its representation in the index, (2) the total market value of the basket is equal to the underlying index value of
    the index options or warrants to be covered, (3) the securities in the basket cannot be used to cover more than the number
    of index options or warrants represented by that value, and (4) the securities in the basket shall be unavailable to support
    any other option or warrant transaction in the account.'
  category: definitional
  conditions: {}
  formula:
    type: informational
    description: See (f)(10)(C)(v)
