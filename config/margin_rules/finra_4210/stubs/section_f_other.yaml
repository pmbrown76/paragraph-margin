- id: 4210_f_10_E_iii
  description: (iii) For purposes of paragraphs (f)(10)(D) and (E), the term "in or at the money" means that the current market
    price o
  citation: FINRA 4210(f)(10)(E)(iii)
  source_quote: (iii) For purposes of paragraphs (f)(10)(D) and (E), the term "in or at the money" means that the current
    market price of the underlying security is not more than two standard exercise intervals below (with respect to a call
    option) or above (with respect to a put option) the exercise price of the option; the term "in the money" means that the
    current market price of the underlying asset or index is not below (with respect to a call option) or above (with respect
    to a put option) the exercise price of the option; the term "overlying option" means a put option purchased or a call
    option written against a "long" position in an underlying asset; or a call option purchased, or a put option written against
    a "short" position in an underlying asset.
