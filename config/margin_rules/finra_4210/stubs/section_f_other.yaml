- id: 4210_f_10_D_i
  description: (i) Notwithstanding the other provisions of this paragraph (f)(10), a member may carry and clear the market
    maker permit
  citation: FINRA 4210(f)(10)(D)(i)
  source_quote: (i) Notwithstanding the other provisions of this paragraph (f)(10), a member may carry and clear the market
    maker permitted offset positions (as defined below) of one or more security futures dealers in an account that is limited
    to market maker transactions, upon a "Good Faith" margin basis that is satisfactory to the concerned parties, provided
    the "Good Faith" margin requirement is not less than the net capital haircut deduction of the member carrying the transaction
    pursuant to SEA Rule 15c3-1 and, if applicable, Rule 4110(a). In lieu of collecting the "Good Faith" margin requirement,
    a carrying member may elect to deduct in computing its net capital the amount of any deficiency between the equity maintained
    in the account and the "Good Faith" margin required.
