- id: 4210_f_9
  description: (9) Free-Riding in Cash Accounts Prohibited
  citation: FINRA 4210(f)(9)
  source_quote: (9) Free-Riding in Cash Accounts Prohibited No member shall permit a customer (other than a broker-dealer)
    to make a practice, directly or indirectly, of effecting transactions in a cash account where the cost of securities purchased
    is met by the sale of the same securities. No member shall permit a customer to make a practice of selling securities
    with them in a cash account which are to be received against payment from another broker-dealer where such securities
    were purchased and are not yet paid for. A member transferring an account which is subject to a Regulation T 90-day freeze
    to another member shall inform the receiving member of such 90-day freeze. The provisions of Section 220.8(c) of Regulation
    T dictate the prohibitions and exceptions against customers' free-riding. Members may apply to FINRA in writing for waiver
    of a 90-day freeze not exempted by Regulation T.
  category: informational
  conditions: {}
  formula:
    type: informational
    description: See (f)(9)
