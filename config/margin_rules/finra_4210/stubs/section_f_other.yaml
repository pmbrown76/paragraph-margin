- id: 4210_f_2_A_ii_b._2._b_2
  description: '2. accrued interest:'
  citation: FINRA 4210(f)(2)(A)(ii)(b.)(2.)
  source_quote: '2. accrued interest: A. on bonds (except bonds issued or guaranteed by the United States Government), that
    portion of the interest on the bonds for a full year, computed for the number of days elapsed since the previous interest
    date on the basis of a 360-day-year. Each calendar month shall be considered to be 1/12 of 360 days, or 30 days, and each
    period from a date in one month to the same date in the following month shall be considered to be 30 days. B. on bonds
    issued or guaranteed by the United States Government, that portion of the interest on the bonds for the current full interest
    period, computed for the actual number of days elapsed since the previous interest date on the basis of actual number
    of calendar days in the current full interest period. The actual elapsed days in each calendar month shall be used in
    determining the number of days in a period.'
  category: informational
  conditions: {}
  formula:
    type: informational
    description: See (f)(2)(A)(ii)(b.)(2.)
