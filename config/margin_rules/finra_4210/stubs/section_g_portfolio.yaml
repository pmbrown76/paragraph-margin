    the member shall immediately transmit telegraphic or facsimile notice of such deficiency to the principal office of the
    SEC in Washington, D.C., the district or regional office of the SEC for the district or region in which the member maintains
    its principal place of business; and to FINRA, or the member's DEA if other than FINRA. The notice to FINRA shall be in
    such form as FINRA may prescribe.
