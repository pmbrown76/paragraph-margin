- id: 4210_g_6_A
  description: (A) For purposes of applying the portfolio margin requirements prescribed in this paragraph (g), members are
    to establis
  citation: FINRA 4210(g)(6)(A)
  source_quote: (A) For purposes of applying the portfolio margin requirements prescribed in this paragraph (g), members are
    to establish and utilize a specific securities margin account, or sub-account of a margin account, clearly identified
    as a portfolio margin account that is separate from any other securities account carried for an eligible participant.
    A margin deficit in the portfolio margin account of an eligible participant may not be considered as satisfied by excess
    equity in another account. Funds and/or securities must be transferred to the deficient account and a written record created
    and maintained. However, if a portfolio margin account is carried as a sub-account of a margin account, excess equity
    in the margin account (determined in accordance with the rules applicable to a margin account other than a portfolio margin
    account) may be used to satisfy a margin deficit in the portfolio margin sub-account without having to transfer any funds
    and/or securities.
