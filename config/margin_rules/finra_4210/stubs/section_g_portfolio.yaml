- id: 4210_g_11
  description: (11) Determination of Value for Margin Purposes
  citation: FINRA 4210(g)(11)
  source_quote: (11) Determination of Value for Margin Purposes For the purposes of this paragraph (g), all eligible products
    shall be valued at current market prices. Account equity for the purposes of paragraphs (g)(9)(A) and (g)(10)(A) shall
    be calculated separately for each portfolio margin account by adding the current market value of all long positions, subtracting
    current market value of all short positions, and adding the credit (or subtracting the debit) balance in the account.
