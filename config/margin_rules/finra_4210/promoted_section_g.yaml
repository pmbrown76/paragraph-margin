- id: 4210_g_7_E
  description: (E) Non-margin eligible equity securities held "long" in a portfolio margin account shall be maintained at
    100 percent o
  citation: FINRA 4210(g)(7)(E)
  source_quote: (E) Non-margin eligible equity securities held "long" in a portfolio margin account shall be maintained at
    100 percent of the current market value at all times. Non-margin eligible equity securities held "short" in a portfolio
    margin account shall be maintained at 50 percent of the current market value at all times.
  conditions:
    security_type: equity
    marginable: false
    account_type: portfolio_margin
  formula:
    type: percentage_of_market_value
    rate: 1.0
    description: 'Non-margin eligible equities long in portfolio margin: 100% margin; short: 50% + current market value'
  produces_calculation: true
  calculation_status: active
- id: 4210_g_9_A
  description: '(A) If, as of the close of business, the equity in the portfolio margin account of an eligible participant
    as described '
  citation: FINRA 4210(g)(9)(A)
  source_quote: (A) If, as of the close of business, the equity in the portfolio margin account of an eligible participant
    as described in paragraph (g)(4)(C), declines below the $5 million minimum equity required, if applicable, and is not
    restored to at least $5 million within three business days by a deposit of funds and/or securities or through favorable
    market action, members are prohibited from accepting new opening orders beginning on the fourth business day, except that
    new opening orders entered for the purpose of reducing market risk may be accepted if the result would be to lower margin
    requirements. This prohibition shall remain in effect until,
  conditions:
    account_type: portfolio_margin
  formula:
    type: account_minimum
    amount: 5000000.0
    description: Portfolio margin eligible participant must maintain $5M minimum equity; 3 business day cure period
  produces_calculation: true
  calculation_status: active
