- id: 4210_g_10_A
  description: (A) If, as of the close of business, the equity in the portfolio margin account of an eligible participant,
    as described
  citation: FINRA 4210(g)(10)(A)
  source_quote: (A) If, as of the close of business, the equity in the portfolio margin account of an eligible participant,
    as described in paragraph (g)(4)(A) through (g)(4)(C), is less than the margin required, the eligible participant may
    deposit additional funds and/or securities or establish a hedge to meet the margin requirement within three business days.
    After the three business day period, members are prohibited from accepting new opening orders, except that new opening
    orders entered for the purpose of reducing market risk may be accepted if the result would be to lower margin requirements.
    In the event an eligible participant fails to hedge existing positions or deposit additional funds and/or securities in
    an amount sufficient to eliminate any margin deficiency after three business days, the member must liquidate positions
    in an amount sufficient to, at a minimum, lower the total margin required to an amount less than or equal to the account
    equity.
  conditions: {}
  formula:
    type: informational
    description: Computational rule — needs margin formula implementation
  produces_calculation: false
  calculation_status: informational
- id: 4210_g_10_E
  description: '(E) Notwithstanding the provisions of subparagraph (A) above, members should not permit an eligible participant
    to make '
  citation: FINRA 4210(g)(10)(E)
  source_quote: (E) Notwithstanding the provisions of subparagraph (A) above, members should not permit an eligible participant
    to make a practice of meeting a portfolio margin deficiency by liquidation. Members must have procedures in place to identify
    accounts that periodically liquidate positions to eliminate margin deficiencies, and the member is expected to take appropriate
    action when warranted. Liquidation to eliminate margin deficiencies that are caused solely by adverse price movements
    may be disregarded.
  conditions: {}
