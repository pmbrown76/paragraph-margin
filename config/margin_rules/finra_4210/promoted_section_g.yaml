rules:
- id: 4210_g
  description: (g) Portfolio Margin
  citation: FINRA 4210(g)
  source_quote: (g) Portfolio Margin As an alternative to the "strategy-based" margin requirements set forth in paragraphs
    (a) through (f) of this Rule, members may elect to apply the portfolio margin requirements set forth in this paragraph
    (g) to all margin equity securities,1 listed options, security futures products (as defined in Section 3(a)(56) of the
    Exchange Act), unlisted derivatives, warrants, stock index warrants, and related instruments (as defined in paragraph
    (g)(2)(D)), provided that the requirements of paragraph (g)(6)(B)(i) of this Rule are met. In addition, a member, provided
    that it is a Futures Commission Merchant ("FCM") and is either a clearing member of a futures clearing organization or
    has an affiliate that is a clearing member of a futures clearing organization, is permitted under this paragraph (g) to
    combine an eligible participant's related instruments with listed index options, unlisted derivatives, options on exchange
    traded funds ("ETF"), stock index warrants and underlying instruments and compute a margin requirement for such combined
    products on a portfolio margin basis. The portfolio margin provisions of this Rule shall not apply to Individual Retirement
    Accounts ("IRAs").
  conditions: {}
  formula:
    type: informational
    description: (g) Portfolio Margin
  produces_calculation: false
  calculation_status: informational
