    description: '(E) Notwithstanding the provisions of subparagraph (A) above, members should not permit an eligible participant
      to make '
  produces_calculation: false
  calculation_status: informational
- id: 4210_g_13
  description: (13) Day Trading Requirements — The day trading restrictions promulgated under paragraph (f)(8)(B) of this
    Rule shall no
  citation: FINRA 4210(g)(13)
  source_quote: (13) Day Trading Requirements — The day trading restrictions promulgated under paragraph (f)(8)(B) of this
    Rule shall not apply to portfolio margin accounts that establish and maintain at least $5 million in equity, provided
    that a member has the ability to monitor the intra-day risk associated with day trading. Portfolio margin accounts that
    do not establish and maintain at least $5 million in equity will be subject to the day trading restrictions under paragraph
    (f)(8)(B) of this Rule, provided the member has the ability to apply the applicable day trading requirement under this
    Rule. However, if the position or positions day traded were part of a hedge strategy, the day trading restrictions will
    not apply. A "hedge strategy" for purposes of this Rule means a transaction or a series of transactions that reduces or
    offsets a material portion of the risk in a portfolio. Members are expected to monitor these portfolio margin accounts
    to detect and prevent circumvention of the day trading requirements.
  conditions:
    account_type: portfolio_margin
  formula:
    type: account_minimum
    amount: 5000000.0
    description: Portfolio margin accounts with $5M+ equity exempt from day trading restrictions under (f)(8)(B)
  produces_calculation: false
  calculation_status: informational
- id: 4210_g_4_C
  description: (C) any person or entity not included in paragraphs (g)(4)(A) and (g)(4)(B) above approved for uncovered options
    and, if
  citation: FINRA 4210(g)(4)(C)
  source_quote: (C) any person or entity not included in paragraphs (g)(4)(A) and (g)(4)(B) above approved for uncovered options
    and, if transactions in security futures are to be included in the account, approval for such transactions is also required.
    However, an eligible participant under this paragraph (g)(4)(C) may not establish or maintain positions in unlisted derivatives
    unless minimum equity of at least $5 million is established and maintained with the member. For purposes of this minimum
    equity requirement, all securities and futures accounts carried by the member for the same eligible participant may be
    combined provided ownership across the accounts is identical. A guarantee pursuant to paragraph (f)(4) of this Rule is
    not permitted for purposes of the minimum equity requirement.
  conditions:
    account_type: portfolio_margin
  formula:
    type: account_minimum
    amount: 5000000.0
    description: 'Portfolio margin eligible participant (non-BD/non-futures): approved for uncovered options; $5M minimum
      if unlisted derivatives included'
  produces_calculation: true
  calculation_status: active
