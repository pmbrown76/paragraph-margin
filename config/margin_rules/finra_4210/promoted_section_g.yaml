  citation: FINRA 4210(g)(1)(I)
  source_quote: (I) monitoring the credit exposure resulting from concentrated positions within both individual portfolio
    margin accounts and across all portfolio margin accounts. Moreover, management must periodically review, in accordance
    with written procedures, the member's credit extension activities for consistency with these guidelines. Management must
